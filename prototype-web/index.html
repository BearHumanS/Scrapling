let uiMode = 'title'; // title|town|idle|anim|battle|levelup|jobchange|skilltree|shop|event|floorclear|ending|result|settings|stats|credits|wipe1|wipe2

function startRun() {
  const bn = runBonus();
  const sheet = newSheet(meta.selected);
  autoLearnSkills(sheet); // 시작 스킬 1개 (RunController 생성자와 동일)
  const player = buildUnit(sheet, bn);
  run = {
    charId: meta.selected, sheet, bonus: bn, mods: bn.mods,
    asc: meta.ascension | 0, // v6: 이 런에 적용되는 어센션 (0이면 v5와 동일)
    floor: 1, floorsCleared: 0,
    gold: bn.mods.startGold,
    potions: B.START_POTIONS + bn.mods.startPotions,
    kills: 0, gearCount: 0, diceRolls: 0,
    bag: { charm: 1, bomb: 0, smoke: 0 }, // 첫 런부터 부적 1개 — 조작의 재미를 즉시 경험
    charmParity: null,                    // 'odd'|'even' — 다음 굴림 강제
    loadout: { weapon: null, armor: null, accessory: null, dice: null }, // 장비 v2 (슬롯당 1개)
    pos: 0, tiles: [], capturedThisFloor: 0,
    rerollLeft: CHARS[meta.selected].reroll,
    reviveLeft: CHARS[meta.selected].revive,
    alive: true,
    player,
    skills: equipActives(sheet)
  };
  logs = [];
  showScreen('run');
  genFloor();
  log('🏰 던전 1층 — ' + themeOf(1).name + '에 진입했다.');
  if (run.asc > 0) log('🔥 어센션 ' + run.asc + ' — 몬스터 HP +' + Math.round((ascHpMult(run.asc) - 1) * 100) +
    '% · 공격 +' + Math.round((ascAtkMult(run.asc) - 1) * 100) + '%');
  busy = false;
  uiMode = 'idle';
  updateHUD();
  tutShow(0); // 튜토리얼 ①: 주사위 굴리기
}
function refreshPlayer() {
  refreshUnit(run.sheet, run.player, run.bonus);
}
function reequip() {
  run.skills = equipActives(run.sheet);
}

/* ===== 층 생성 ===== */
function rollTileType() {
  const v = Math.random();
  let acc = B.TILE_BATTLE;
  if (v < acc) return 'battle';
  acc += B.TILE_ELITE;
  if (v < acc) return 'elite';
  acc += B.TILE_TREASURE;
  if (v < acc) return 'treasure';
  acc += B.TILE_EVENT;
  if (v < acc) return 'event';
  acc += B.TILE_TRAP;
  if (v < acc) return 'trap';
  return 'battle';
}
function genFloor() {
  const size = B.BOARD_SIZE;
  const types = new Array(size).fill(null);
  types[0] = 'start';
  const shopI = randInt(1, size);
  let restI;
  do { restI = randInt(1, size); } while (restI === shopI);
  types[shopI] = 'shop';
  types[restI] = 'rest';
  for (let i = 1; i < size; i++) {
    if (i === shopI || i === restI) continue;
    types[i] = rollTileType();
  }
  run.tiles = types.map((t, i) => ({ index: i, type: t, captured: false }));
  run.pos = 0;
  run.capturedThisFloor = 0;
  run.rerollLeft = CHARS[run.charId].reroll; // 층당 1회 (RunController.PlayFloor)
  renderBoard();
  placeToken(false);
  updateCenter();
}

/* ===== 보드 렌더링: 7×7 둘레 24칸 ===== */
function tileGridPos(i) {
  if (i <= 6)  return { r: 6,       c: i };
  if (i <= 12) return { r: 12 - i,  c: 6 };
  if (i <= 18) return { r: 0,       c: 18 - i };
  return       { r: i - 18,         c: 0 };
}
function renderBoard() {
  const board = $('board');
  board.innerHTML = '';
  run.tiles.forEach(t => {
    const p = tileGridPos(t.index);
    const d = document.createElement('div');
    d.className = 'tile ' + t.type + (t.captured ? ' captured' : '');
    d.id = 'tile-' + t.index;
    d.style.gridRow = (p.r + 1);
    d.style.gridColumn = (p.c + 1);
    d.textContent = TILE_DEFS[t.type].e;
    board.appendChild(d);
  });
  const center = document.createElement('div');
  center.className = 'board-center';
  center.innerHTML =
    '<div class="bc-theme" id="bcTheme"></div>' +
    '<div class="bc-floor" id="bcFloor"></div>' +
    '<div class="bc-elem" id="bcElem"></div>' +
    '<div class="dicewrap"><div class="die" id="die1">?</div><div class="die" id="die2">?</div></div>' +
    '<div class="bc-badges" id="bcBadges"></div>' +
    '<div class="bc-hint" id="bcHint"></div>';
  board.appendChild(center);
  const token = document.createElement('div');
  token.id = 'token';
  token.textContent = CHARS[run.charId].icon;
  board.appendChild(token);
}
function updateCenter() {
  const el = floorElement(run.floor);
  $('bcTheme').textContent = themeOf(run.floor).name;
  $('bcFloor').textContent = run.floor + 'F';
  $('bcElem').textContent = '몬스터 속성: ' + ELEM_INFO[el].icon + ' ' + ELEM_INFO[el].n;
  $('bcHint').textContent = '🚪 완주까지 ' + (B.BOARD_SIZE - run.pos) + '칸 → 보스전';
}
function placeToken(hop) {
  const el = $('tile-' + run.pos);
  const token = $('token');
  if (!el || !token) return;
  if (!hop) token.classList.add('notrans');
  token.style.left = (el.offsetLeft + el.offsetWidth / 2) + 'px';
  token.style.top  = (el.offsetTop  + el.offsetHeight * 0.42) + 'px';
  if (!hop) {
    void token.offsetWidth;
    token.classList.remove('notrans');
  } else {
    token.classList.remove('hopping');
    void token.offsetWidth;
    token.classList.add('hopping');
  }
  document.querySelectorAll('.tile.cur').forEach(t => t.classList.remove('cur'));
  el.classList.add('cur');
}

/* ===== HUD ===== */
function updateHUD() {
  if (!run) return;
  const p = run.player, sh = run.sheet;
  $('hudFloor').textContent = run.floor;
  $('hudJob').textContent = jobName(sh) + ' Lv.' + sh.level;
  $('hudGold').textContent = run.gold;
  $('hudSoul').textContent = meta.soul;
  const need = xpToLevel(sh.level);
  $('xpFill').style.width = Math.min(100, sh.xp / need * 100) + '%';
  $('xpText').textContent = 'XP ' + sh.xp + ' / ' + need;
  const ratio = Math.max(0, p.hp / p.maxHp);
  const fill = $('hpFill');
  fill.style.width = (ratio * 100) + '%';
  fill.style.background = ratio > 0.5
    ? 'linear-gradient(90deg,#4fd06a,#8ce07a)'
    : ratio > 0.25
      ? 'linear-gradient(90deg,#e0a03a,#f0c05a)'
      : 'linear-gradient(90deg,#d84848,#f07a5a)';
  $('hpText').textContent = '❤️ ' + p.hp + ' / ' + p.maxHp;
  $('subStats').textContent = '⚔️' + p.atk + ' 🔮' + p.matk + ' 🛡️' + p.def + '/' + p.mdef;
  $('btnFieldPotion').innerHTML = '🧪 ×' + run.potions + '<br><small style="font-size:9px;font-weight:600">HP 40%</small>';
  $('btnFieldPotion').disabled = busy || run.potions <= 0 || p.hp >= p.maxHp;
  $('btnRoll').disabled = busy;
  $('btnTree').disabled = busy;
  // v5 소모품 3슬롯 (수량 배지) — 부적은 굴리기 전에 눌러 홀/짝 선택
  $('cntCharm').textContent = run.bag.charm;
  $('cntBomb').textContent = run.bag.bomb;
  $('cntSmoke').textContent = run.bag.smoke;
  const charmBtn = $('btnCharm');
  charmBtn.classList.toggle('armed', !!run.charmParity);
  $('charmSub').textContent = run.charmParity
    ? (run.charmParity === 'even' ? '짝수 강제! (취소)' : '홀수 강제! (취소)')
    : '홀/짝 강제';
  charmBtn.disabled = busy || (!run.charmParity && run.bag.charm <= 0);
  const badge = $('treeBadge');
  const pts = sh.points + sh.statPoints;
  badge.style.display = pts > 0 ? 'flex' : 'none';
  badge.textContent = pts;
}
function setBusy(v) {
  busy = v;
  updateHUD();
}

/* ===== 플레이어 회복/피해 (필드) ===== */
function healRatio(ratio, srcLabel) {
  const p = run.player;
  const amt = Math.round(p.maxHp * ratio);
  const real = Math.min(p.maxHp - p.hp, amt);
  p.hp = Math.min(p.maxHp, p.hp + amt);
  if (real > 0) { floatText($('token') || $('hpFill'), '+' + real, 'heal'); SFX.heal(); }
  if (srcLabel) log('💚 ' + srcLabel + ' HP +' + real);
  updateHUD();
  return real;
}
function damagePlayerField(dmg, srcLabel) {
  const p = run.player;
  p.hp = Math.max(0, p.hp - dmg);
  shake($('boardWrap'));
  floatText($('token'), '-' + dmg, 'dmg');
  log('💥 ' + srcLabel + ' 피해 -' + dmg);
  updateHUD();
  if (p.hp <= 0) { die(); return false; }
  return true;
}
/* 전설 고유 효과 보유 확인 (EquipmentLoadout.HasEffect) */
function hasEffect(eff) {
  return SLOT_KEYS.some(k => run.loadout[k] && run.loadout[k].effect === eff);
}
/* 골드 획득 단일 지점 — 전설 '골드 탐지(+25%)' 적용 (RunController.AddGold) */
function addGold(g, label) {
  if (hasEffect('goldFind')) g = Math.trunc(g * 1.25);
  run.gold += g;
  floatText($('token'), '+' + g + ' 💰', 'gold');
  SFX.gold();
  if (label) log('💰 ' + label + ' 골드 +' + g);
  updateHUD();
}
/* 장비 합계 → 시트 반영 (EquipmentLoadout.ApplyTo + Refresh) */
function applyLoadout() {
  const sh = run.sheet;
  let a = 0, d = 0, h = 0, c = 0;
  for (const k of SLOT_KEYS) {
    const e = run.loadout[k];
    if (!e) continue;
    a += e.atk; d += e.def; h += e.hp; c += e.crit;
  }
  sh.gearAtk = a; sh.gearDef = d; sh.gearHp = h; sh.gearCrit = c;
  refreshPlayer(); // maxHp 증가분만큼 현재 HP도 증가
}
/* 장비 획득 (장비 v2): 슬롯 4종·등급 5단계, 점수 비교 자동 교체 — 하위품은 매각 */
function addGear(silent) {
  run.gearCount++;
  const item = generateEquipment(run.floor);
  const cur = run.loadout[item.slot];
  if (!cur || gearScore(cur) < gearScore(item)) {
    run.loadout[item.slot] = item;
    applyLoadout();
    if (!silent) floatText($('token'), SLOT_INFO[item.slot].icon + ' 장착!', 'info');
    log(SLOT_INFO[item.slot].icon + ' <span class="rar' + item.rarity + '">' +
        gearDisplayName(item) + '</span> 장착! (' + gearStatText(item) + ')');
  } else {
    log('🗡️ <span class="rar' + item.rarity + '">' + gearDisplayName(item) + '</span>' +
        ' — 지금 것보다 약해서 매각했다.');
    addGold(B.gearSalePrice(run.floor));
  }
  updateHUD();
}
function useFieldPotion() {
  if (busy || !run || !run.alive) return;
  if (run.potions <= 0 || run.player.hp >= run.player.maxHp) return;
  run.potions--;
  healRatio(B.POTION_HEAL, '포션 사용!');
  updateHUD();
}

/* ===== v5 소모품: 홀짝 부적 — 굴리기 전에 눌러 홀/짝 선택 → 이번 굴림 강제 ===== */
function tapCharm() {
  if (busy || !run || !run.alive || uiMode !== 'idle') return;
  if (run.charmParity) { // 재탭 = 취소 (환불)
    run.bag.charm++;
    run.charmParity = null;
    log('🔮 부적 사용을 취소했다.');
    updateHUD();
    return;
  }
  if (run.bag.charm <= 0) return;
  uiMode = 'charm';
  setBusy(true);
  overlay(
    '<div class="m-title">🔮 홀짝 부적</div>' +
    '<div class="m-sub">이번 굴림의 합을 원하는 홀짝으로 강제한다 (보유 ' + run.bag.charm + '개)<br>' +
      '"6칸 앞 쉼터에 가고 싶다 → 짝수 부적"</div>' +
    '<button class="m-btn" onclick="charmPick(\'odd\')">홀수로 강제 (3·5·7·9·11)</button>' +
    '<button class="m-btn" onclick="charmPick(\'even\')">짝수로 강제 (2·4·6·8·10·12)</button>' +
    '<button class="m-btn dark" onclick="charmCancel()">취소</button>'
  );
}
function charmPick(parity) {
  if (!run || run.charmParity || run.bag.charm <= 0) return;
  if (uiMode !== 'charm' && uiMode !== 'idle') return;
  run.bag.charm--;
  run.charmParity = parity;
  if (uiMode === 'charm') { closeOverlay(); uiMode = 'idle'; }
  log('🔮 홀짝 부적! 이번 굴림은 <b>' + (parity === 'even' ? '짝수' : '홀수') + '</b>로 강제된다.');
  setBusy(false);
}
function charmCancel() {
  if (uiMode !== 'charm') return;
  closeOverlay();
  uiMode = 'idle';
  setBusy(false);
}

/* =====================================================================
 * 주사위 → 이동
 * ===================================================================== */
function rollDice() {
  if (busy || !run || !run.alive) return;
  setBusy(true);
  uiMode = 'anim';
  SFX.dice();
  $('bcBadges').innerHTML = '';
  const d1El = $('die1'), d2El = $('die2');
  d1El.classList.add('rolling');
  d2El.classList.add('rolling');
  const tick = setInterval(() => {
    d1El.textContent = randInt(1, 7);
    d2El.textContent = randInt(1, 7);
  }, T.DICE_TICK);

  setTimeout(() => {
    clearInterval(tick);
    let d1 = randInt(1, 7), d2 = randInt(1, 7);
    // 홀짝 부적: 원하는 홀짝이 나올 때까지 리롤 (DiceRoller.RollWithParity)
    let charmUsed = null;
    if (run.charmParity) {
      const wantEven = run.charmParity === 'even';
      while (((d1 + d2) % 2 === 0) !== wantEven) { d1 = randInt(1, 7); d2 = randInt(1, 7); }
      charmUsed = run.charmParity;
      run.charmParity = null;
    }
    run.diceRolls++;
    let rerolled = false;
    // 도적 패시브: 층당 1회, 낮은 눈(합≤4)이면 무료 리롤 (RunController.PlayFloor)
    if (run.rerollLeft && d1 + d2 <= 4) {
      run.rerollLeft = false;
      rerolled = true;
      d1 = randInt(1, 7); d2 = randInt(1, 7);
      run.diceRolls++;
    }
    // 주사위 장비 효과 (DiceModRules.Apply — 이동 굴림 조작, RunController.PlayFloor와 동일 순서)
    let modLabel = null;
    if (run.loadout.dice && run.loadout.dice.diceMod) {
      const dm = applyDiceMod(d1, d2, run.loadout.dice.diceMod);
      if (dm) { d1 = dm.d1; d2 = dm.d2; modLabel = dm.label; }
    }
    const info = { d1, d2, sum: d1 + d2, isDouble: d1 === d2, isSeven: d1 + d2 === 7 };
    d1El.classList.remove('rolling'); d2El.classList.remove('rolling');
    d1El.textContent = d1; d2El.textContent = d2;
    d1El.classList.add('landed'); d2El.classList.add('landed');
    setTimeout(() => { d1El.classList.remove('landed'); d2El.classList.remove('landed'); }, 320);

    let badges = '';
    if (charmUsed) badges += '<div class="badge">🔮 부적 — ' + (charmUsed === 'even' ? '짝수' : '홀수') + ' 강제!</div>';
    if (rerolled) badges += '<div class="badge">🥷 도적의 리롤!</div>';
    if (modLabel) badges += '<div class="badge">🎲 ' + modLabel + '!</div>';
    if (info.isDouble) badges += '<div class="badge">✨ 더블! 선제공격</div>';
    if (info.isSeven)  badges += '<div class="badge">🍀 럭키 7! 크리티컬 +15%</div>';
    $('bcBadges').innerHTML = badges;
    log('🎲 주사위: ' + d1 + ' + ' + d2 + ' = ' + info.sum +
        (charmUsed ? ' (부적)' : '') + (rerolled ? ' (리롤)' : '') + (modLabel ? ' (' + modLabel + ')' : '') +
        (info.isDouble ? ' (더블!)' : '') + (info.isSeven ? ' (럭키 7!)' : ''));

    setTimeout(() => moveSteps(info), dur(380));
  }, T.DICE);
}

function moveSteps(info) {
  const lapComplete = run.pos + info.sum >= B.BOARD_SIZE;
  let remaining = info.sum;
  const step = () => {
    run.pos = (run.pos + 1) % B.BOARD_SIZE;
    placeToken(true);
    SFX.hop();
    updateCenter();
    remaining--;
    if (remaining > 0) setTimeout(step, T.STEP);
    else setTimeout(() => land(lapComplete, info), T.LAND);
  };
  step();
}

function land(lapComplete, info) {
  if (lapComplete) {
    const g = Math.trunc(B.lapBonusGold(run.floor) * run.mods.lapGoldMult);
    addGold(g, '한 바퀴 완주!');
    if (hasEffect('lapFullHeal')) { // 전설 고유 효과: 완주 시 HP 전체 회복
      healRatio(1.0, '💖 전설 효과 — 완주 회복!');
    }
    log('👑 보스 게이트가 열렸다...');
    setTimeout(() => startBossBattle(info), dur(850));
    return;
  }
  resolveTile(info);
}

/* =====================================================================
 * 타일 이벤트 — RunController.ResolveTile 규칙
 * ===================================================================== */
function endTurn() {
  if (!run || !run.alive) return;
  uiMode = 'idle';
  setBusy(false);
}

function resolveTile(info) {
  const tile = run.tiles[run.pos];
  const f = run.floor;

  switch (tile.type) {
    case 'battle':
    case 'elite': {
      if (tile.captured) {
        healRatio(B.CAPTURED_HEAL + run.mods.captureHealBonus, '점령지(내 땅)에서 정비.');
        endTurn();
        return;
      }
      const elite = tile.type === 'elite';
      startBattle({
        monsters: makeMonsters(f, elite),
        info: info,
        title: elite ? '☠️ 정예 전투!' : '⚔️ 전투!',
        isElite: elite,
        onWin: () => {
          tile.captured = true;
          run.capturedThisFloor++;
          const el = $('tile-' + tile.index);
          if (el) el.classList.add('captured');
          log('🚩 칸을 점령했다! (재방문 회복 · 전투 실드 +)');
          addGold(B.battleGold(f) * (elite ? 2 : 1), elite ? '정예 처치! (2배)' : '전투 승리!');
          if (elite) addGear();
          endTurn();
          tutShow(2); // 튜토리얼 ③: 칸 점령의 의미 (탭하면 ④ 완주=보스로 이어짐)
        }
      });
      return;
    }

    case 'treasure': {
      if (chance(B.MIMIC_CHANCE)) {
        log('📦 상자가... 움직인다?! 미믹이다!');
        startBattle({
          monsters: makeMonsters(f, false, true),
          info: info,
          title: '📦 미믹 기습!',
          onWin: () => { log('📦 미믹을 물리쳤다. (전리품은 없었다...)'); endTurn(); }
        });
        return;
      }
      // v5: 장비 40% / 골드 35% / 소모품 25% (RunController.ResolveTile Treasure)
      const v2 = Math.random();
      if (v2 < 0.40) addGear();
      else if (v2 < 0.75) addGold(B.treasureGold(f), '보물 상자!');
      else {
        const k = CONSUM_KEYS[randInt(0, 3)];
        run.bag[k]++;
        floatText($('token'), CONSUM[k].icon + ' ' + CONSUM[k].n + '!', 'info');
        log(CONSUM[k].icon + ' 보물 상자에서 <b>' + CONSUM[k].n + '</b>을(를) 얻었다!');
      }
      endTurn();
      return;
    }

    case 'shop':
      openShop();
      return;

    case 'rest': {
      const mult = CHARS[run.charId].restHeal2 ? 2 : 1; // 성직자: 쉼터 회복 2배
      healRatio(B.REST_HEAL * mult + run.mods.restHealBonus, '모닥불에서 휴식.');
      endTurn();
      return;
    }

    case 'trap': {
      // 함정 회피 = 기본 30% + 유물 + 전설 '함정 감지' 25%p
      if (chance(B.TRAP_AVOID + run.mods.trapAvoidBonus + (hasEffect('trapWard') ? 0.25 : 0))) {
        log('🤸 함정을 재빠르게 회피했다!');
        floatText($('token'), '회피!', 'info');
        endTurn();
        return;
      }
      const dmg = Math.floor(run.player.maxHp * B.TRAP_DMG);
      if (damagePlayerField(dmg, '가시 함정!')) endTurn();
      return;
    }

    case 'event':
      openEvent();
      return;

    default:
      endTurn();
      return;
  }
}

/* ===== 이벤트 칸 (깊이 v5): 8종 × 선택지 × 스탯 판정 — 플레이어가 직접 고른다 =====
 * 판정 = 50% ± (스탯-난이도)×4.5%p (25~95% 클램프). 마법사 패시브 = 실패 판정 1회 재굴림 */
let curEvent = null;   // { def, phase:'choose'|'result' }
function openEvent() {
  const all = buildEvents(run.floor);
  curEvent = { def: all[randInt(0, all.length)], phase: 'choose' };
  uiMode = 'event';
  renderEventChoices();
}
function renderEventChoices() {
  const def = curEvent.def, stats = run.sheet.stats;
  const chanceCls = p => p >= 0.65 ? 'hi' : p >= 0.45 ? 'mid' : 'lo';
  const outcomeHint = o => {
    if (!o) return '변화 없음';
    const p = [];
    if (o.gold > 0) p.push('💰+' + o.gold); else if (o.gold < 0) p.push('💰' + o.gold);
    if (o.hpRatio > 0) p.push('❤️+' + Math.round(o.hpRatio * 100) + '%');
    else if (o.hpRatio < 0) p.push('💢-' + Math.round(-o.hpRatio * 100) + '%');
    if (o.gear) p.push('🗡️장비');
    if (o.item) p.push(CONSUM[o.item].icon + CONSUM[o.item].n);
    if (o.xp) p.push('✨XP+' + o.xp);
    return p.length ? p.join(' ') : '변화 없음';
  };
  overlay(
    '<div class="m-title">' + def.icon + ' ' + def.name + '</div>' +
    '<div class="m-sub">' + themeOf(run.floor).name + ' ' + run.floor + '층 — 어떻게 할까?' +
      (CHARS[run.charId].bestEvent ? '<br>🧙 마법사 패시브: 실패한 판정을 1회 다시 굴린다' : '') + '</div>' +
    def.choices.map((c, i) => {
      const p = evSuccessChance(c, stats);
      const cost = c.success && c.success.gold < 0 ? -c.success.gold : 0;
      const afford = cost <= run.gold;
      let sub;
      if (c.check) {
        sub = STAT_INFO[c.check].icon + ' ' + EV_STAT_NAMES[c.check] + ' 판정 — 성공 ' +
          '<span class="ev-chance ' + chanceCls(p) + '">' + Math.round(p * 100) + '%</span>' +
          ' · 성공: ' + outcomeHint(c.success) + ' / 실패: ' + outcomeHint(c.fail);
      } else if (c.success) {
        sub = outcomeHint(c.success);
      } else {
        sub = '아무 일도 일어나지 않는다';
      }
      return '<button class="ev-choice" onclick="evChoice(' + i + ')"' + (afford ? '' : ' disabled') + '>' +
        c.desc + (c.check ? ' <span style="color:#8fd0ff">(' + EV_STAT_NAMES[c.check] + ' ' + stats[c.check] + ')</span>' : '') +
        '<small>' + sub + '</small></button>';
    }).join('')
  );
}
function evChoice(i) {
  if (!curEvent || curEvent.phase !== 'choose') return;
  const c = curEvent.def.choices[i];
  const cost = c.success && c.success.gold < 0 ? -c.success.gold : 0;
  if (cost > run.gold) return;

  let success = true, mageReroll = false, p = 1;
  if (c.check) {
    p = evSuccessChance(c, run.sheet.stats);
    success = chance(p);
    // 마법사 패시브 (깊이 v5 재정의): 실패한 판정을 한 번 다시 굴림
    if (!success && CHARS[run.charId].bestEvent) {
      mageReroll = true;
      success = chance(p);
    }
  }
  curEvent.phase = 'result';
  curEvent.outcome = (success ? c.success : c.fail) || {};
  const o = curEvent.outcome;
  const lines = [];
  if (o.gold > 0) lines.push('💰 골드 +' + o.gold);
  else if (o.gold < 0) lines.push('💰 골드 ' + o.gold);
  if (o.hpRatio > 0) lines.push('❤️ HP ' + Math.round(o.hpRatio * 100) + '% 회복');
  else if (o.hpRatio < 0) lines.push('💢 최대 HP의 ' + Math.round(-o.hpRatio * 100) + '% 피해');
  if (o.gear) lines.push('🗡️ 장비 획득');
  if (o.item) lines.push(CONSUM[o.item].icon + ' ' + CONSUM[o.item].n + ' 획득');
  if (o.xp) lines.push('✨ 경험치 +' + o.xp);
  overlay(
    '<div class="m-title">' + curEvent.def.icon + ' ' + curEvent.def.name + '</div>' +
    '<div class="m-sub">' + c.desc + (c.check ? ' — ' + EV_STAT_NAMES[c.check] + ' 판정 ' + Math.round(p * 100) + '%' : '') + '</div>' +
    (c.check
      ? '<div class="ev-result ' + (success ? 'ok' : 'bad') + '">' +
          (success ? '✅ 판정 성공!' : '❌ 판정 실패...') +
          (mageReroll ? '<br><span style="font-size:12px;color:#b8aef5">🧙 마법사의 재굴림' +
            (success ? '으로 뒤집었다!' : '도 실패했다...') + '</span>' : '') + '</div>'
      : '') +
    '<p style="font-size:14.5px;line-height:1.9;margin:8px 0 4px">' +
      (lines.length ? lines.join('<br>') : '아무 일도 일어나지 않았다.') + '</p>' +
    '<button class="m-btn" onclick="evResultOk()">확인</button>'
  );
  if (c.check) log(success ? '✅ ' + curEvent.def.name + ' — 판정 성공!' : '❌ ' + curEvent.def.name + ' — 판정 실패...');
}
function evResultOk() {
  if (!curEvent || curEvent.phase !== 'result') return;
  const o = curEvent.outcome;
  curEvent = null;
  closeOverlay();
  // RunController.ApplyOutcome 순서: 골드 → HP → 장비 → 아이템 → XP
  if (o.gold > 0) addGold(o.gold, '이벤트:');
  else if (o.gold < 0) { run.gold = Math.max(0, run.gold + o.gold); updateHUD(); }
  let dead = false;
  if (o.hpRatio > 0) healRatio(o.hpRatio, '이벤트:');
  else if (o.hpRatio < 0) dead = !damagePlayerField(Math.trunc(run.player.maxHp * -o.hpRatio), '이벤트!');
  if (o.gear) addGear();
  if (o.item) {
    run.bag[o.item]++;
    log(CONSUM[o.item].icon + ' <b>' + CONSUM[o.item].n + '</b>을(를) 얻었다!');
    updateHUD();
  }
  if (dead) return; // die()가 이미 처리
  if (o.xp) {
    floatText($('token'), '+' + o.xp + ' XP', 'xp');
    const gained = gainXp(run.sheet, o.xp);
    log('✨ 경험치 +' + o.xp + (gained > 0 ? ' — 레벨 업!' : ''));
    updateHUD();
    if (gained > 0) { SFX.levelup(); processProgression(() => endTurn()); return; }
  }
  endTurn();
}

/* ===== 상점 (상인의 인장: 할인) ===== */
function shopPrices() {
  const f = run.floor, disc = 1 - run.mods.shopDiscount;
  return {
    pot: Math.trunc(B.potionPrice(f) * disc),
    gear: Math.trunc(B.gearPrice(f) * disc),
    charm: Math.trunc(CONSUM.charm.price(f) * disc)
  };
}
function openShop() {
  uiMode = 'shop';
  renderShop();
  log('⚖️ 상인을 만났다.');
}
function renderShop() {
  const f = run.floor, pr = shopPrices();
  overlay(
    '<div class="m-title">⚖️ 던전 상점</div>' +
    '<div class="m-sub">' + f + '층 시세' +
      (run.mods.shopDiscount > 0 ? ' (🪙 ' + Math.round(run.mods.shopDiscount * 100) + '% 할인)' : '') +
      ' — 보유 💰 <b id="shopGold">' + run.gold + '</b></div>' +
    '<div class="shop-item"><div class="info">🧪 포션<small>HP 40% 회복 (보유 ' +
      '<span id="shopPot">' + run.potions + '</span>개)</small></div>' +
      '<button class="buy-btn" id="buyPot" onclick="buyPotion()">💰 ' + pr.pot + '</button></div>' +
    '<div class="shop-item"><div class="info">🔮 홀짝 부적<small>이번 굴림 홀/짝 강제 (보유 ' +
      '<span id="shopCharm">' + run.bag.charm + '</span>개)</small></div>' +
      '<button class="buy-btn" id="buyCharm" onclick="buyCharm()">💰 ' + pr.charm + '</button></div>' +
    '<div class="shop-item"><div class="info">🗡️ 장비<small>무작위 장비 — 슬롯 4종 · 등급 5단계' +
      ' (하위품은 자동 매각)</small></div>' +
      '<button class="buy-btn" id="buyGear" onclick="buyGear()">💰 ' + pr.gear + '</button></div>' +
    '<button class="m-btn dark" onclick="closeShop()">나가기</button>'
  );
  refreshShopButtons();
}
function refreshShopButtons() {
  const pr = shopPrices();
  $('shopGold').textContent = run.gold;
  $('shopPot').textContent = run.potions;
  $('shopCharm').textContent = run.bag.charm;
  $('buyPot').disabled = run.gold < pr.pot;
  $('buyCharm').disabled = run.gold < pr.charm;
  $('buyGear').disabled = run.gold < pr.gear;
}
function buyCharm() {
  const pr = shopPrices();
  if (run.gold < pr.charm) return;
  run.gold -= pr.charm;
  run.bag.charm++;
  log('🔮 홀짝 부적 구매 (-' + pr.charm + 'G)');
  updateHUD();
  refreshShopButtons();
}
function buyPotion() {
  const pr = shopPrices();
  if (run.gold < pr.pot) return;
  run.gold -= pr.pot;
  run.potions++;
  log('🧪 포션 구매 (-' + pr.pot + 'G)');
  updateHUD();
  refreshShopButtons();
}
function buyGear() {
  const pr = shopPrices();
  if (run.gold < pr.gear) return;
  run.gold -= pr.gear;
  addGear(true);
  updateHUD();
  refreshShopButtons();
}
function closeShop() {
  closeOverlay();
  endTurn();
}

/* =====================================================================
 * PART D — 전투 (InteractiveBattle.cs 이식: 플레이어 행동 + 몬스터 반격 = 1라운드)
 * ===================================================================== */
function makeMonsters(floor, elite, mimic) {
  const th = themeOf(floor);
  const asc = run ? (run.asc | 0) : 0; // 어센션 0 → ×1.0 = v5 동일
  const hp = Math.round(B.monsterHp(floor) * ascHpMult(asc));
  const atk = Math.round(B.monsterAtk(floor) * ascAtkMult(asc));
  const def = B.monsterDef(floor);
  const element = floorElement(floor);
  const mk = (name, emoji, mhp, matk, spd, isBoss) => ({
    name, emoji, isBoss: !!isBoss,
    maxHp: mhp, hp: mhp, atk: matk, matk: matk, def, mdef: def,
    spd, crit: 0.05, evasion: 0, accuracy: 0.9, element, st: {},
    trait: null, shieldedHits: 0
  });
  if (elite) {
    return [mk('정예 ' + th.mobName, '👹', Math.floor(hp * B.ELITE_HP_MULT), Math.floor(atk * B.ELITE_ATK_MULT), 9)];
  }
  if (mimic) {
    return [mk('미믹', '📦', hp, atk, 8)];
  }
  const count = floor <= B.SOLO_MONSTER_FLOORS ? 1 : randInt(1, 3);
  const list = [];
  for (let i = 0; i < count; i++) {
    // 몬스터 개성 (깊이 v5): 3층부터 35% — 이름으로 노출해 "누굴 먼저 잡지?"를 만든다
    const trait = rollTrait(floor);
    const baseName = th.mobName + (count > 1 ? ' ' + (i + 1) : '');
    const m = mk(trait ? TRAITS[trait].n + ' ' + baseName : baseName,
                 th.mobs[randInt(0, th.mobs.length)], hp, atk, 8);
    m.trait = trait;
    if (trait === 'shielded') m.shieldedHits = 2;
    list.push(m);
  }
  return list;
}
function makeBoss(floor) {
  const th = themeOf(floor);
  const asc = run ? (run.asc | 0) : 0; // 어센션 0 → ×1.0 = v5 동일
  const hp = Math.floor(Math.round(B.monsterHp(floor) * ascHpMult(asc)) * B.BOSS_HP_MULT);
  const atk = Math.floor(Math.round(B.monsterAtk(floor) * ascAtkMult(asc)) * B.BOSS_ATK_MULT);
  const def = B.monsterDef(floor);
  const trait = floor >= 10 ? 'enrage' : null; // 심층 보스: 광폭화 고정 (깊이 v5)
  return [{
    name: (trait ? TRAITS[trait].n + ' ' : '') + th.bossName, emoji: th.boss, isBoss: true,
    maxHp: hp, hp, atk, matk: atk, def, mdef: def,
    spd: 9, crit: 0.05, evasion: 0, accuracy: 0.9, element: floorElement(floor), st: {},
    trait, shieldedHits: 0
  }];
}

function startBossBattle(info) {
  startBattle({
    monsters: makeBoss(run.floor),
    info: info,
    title: '👑 보스전 — ' + themeOf(run.floor).bossName,
    isBoss: true,
    onWin: () => floorClear()
  });
}

function startBattle(cfg) {
  const c = CHARS[run.charId], sh = run.sheet;
  // 점령 칸 실드: 기본 2/칸 × 기사 2배 × 요새화 3배 + 마법사 방벽 (RunController.Fight)
  const perTile = 2 * (c.captureShield2 ? 2 : 1) * (hasCaptureTriple(sh) ? 3 : 1);
  const startShield = run.capturedThisFloor * perTile + Math.trunc(run.player.maxHp * c.barrier);
  bt = {
    monsters: cfg.monsters,
    critBonus: cfg.info && cfg.info.isSeven ? 0.15 : 0,
    playerFirst: !!(cfg.info && cfg.info.isDouble),
    firstRound: true,
    defending: false,
    shield: startShield,
    burnOnHit: burnOnHitChance(sh),
    reviveRatio: hasReviveBoost(sh) ? 0.7 : 0.5, // 소생의 빛: 부활 HP 70%
    isBoss: !!cfg.isBoss,
    isElite: !!cfg.isElite,
    title: cfg.title,
    onWin: cfg.onWin,
    onFlee: cfg.onFlee || (() => endTurn()), // 연막탄 도주: 보상·점령 없음
    xpKills: 0,
    over: false,
    locked: true
  };
  let badges = '';
  if (bt.playerFirst) badges += '<div class="badge">✨ 더블 — 선제공격! (첫 턴 반격 없음)</div>';
  if (bt.critBonus > 0) badges += '<div class="badge">🍀 럭키 7 — 크리티컬 +15%</div>';
  if (startShield > 0) badges += '<div class="badge">🛡 시작 실드 ' + startShield + '</div>';

  const enemies = bt.monsters.map((m, i) =>
    '<div class="enemy" id="bt-en-' + i + '">' +
      '<div class="e-sprite' + (m.isBoss ? ' boss' : '') + '">' + m.emoji + '</div>' +
      '<div class="e-name">' + ELEM_INFO[m.element].icon + ' ' + m.name + '</div>' +
      '<div class="ehp"><div class="ehpfill" id="bt-ehp-' + i + '" style="width:100%"></div></div>' +
      '<div class="ehptext" id="bt-eht-' + i + '">' + m.hp + ' / ' + m.maxHp + '</div>' +
      '<div class="chips" id="bt-chips-' + i + '"></div>' +
    '</div>'
  ).join('');

  uiMode = 'battle';
  overlay(
    '<div class="m-title' + (bt.isBoss ? ' boss' : '') + '">' + bt.title + '</div>' +
    '<div class="m-badges">' + badges + '</div>' +
    '<div class="enemyRow">' + enemies + '</div>' +
    '<div id="btMsg"></div>' +
    '<div class="pl-row" id="btPlRow">' +
      '<div class="pl-sprite">' + CHARS[run.charId].icon + '</div>' +
      '<div class="pl-hp"><div class="hpbar"><div class="hpfill" id="btPhpFill"></div><span id="btPhpText"></span></div></div>' +
      '<div class="pl-shield" id="btShield"></div>' +
    '</div>' +
    '<div class="chips" id="btPlChips"></div>' +
    '<div class="skillbar" id="btSkillBar"></div>' +
    '<div class="bt-consum">' +
      '<button id="btnBtBomb" onclick="btBomb()" disabled>💣 폭탄</button>' +
      '<button id="btnBtSmoke" onclick="btSmoke()" disabled>🌫 연막탄</button>' +
    '</div>' +
    '<div class="actions" id="btActions">' +
      '<button class="act-btn atk" id="btnAtk" onclick="btAttack()">⚔️ 공격</button>' +
      '<button class="act-btn def" id="btnDef" onclick="btDefend()">🛡️ 방어<small>피해 50%↓</small></button>' +
      '<button class="act-btn pot" id="btnPot" onclick="btPotion()">🧪 포션 ×' + run.potions + '<small>HP 40%</small></button>' +
    '</div>',
    'battle'
  );
  updateBattleUI();
  tutShow(1); // 튜토리얼 ②: 전투 — 공격/스킬
  setTimeout(playerTurnStart, dur(400));
}

function renderSkillBar(enabled) {
  const bar = $('btSkillBar');
  if (!bar) return;
  const cells = [];
  for (let i = 0; i < B.SKILL_SLOTS; i++) {
    const s = run.skills[i];
    if (!s) {
      cells.push('<button class="sk-act empty" disabled>—<small>빈 슬롯</small></button>');
      continue;
    }
    const sub = [];
    if (s.coef > 0) sub.push((s.magic ? '🔮' : '⚔️') + Math.round(s.coef * 100) + '%');
    if (s.healRatio > 0) sub.push('✚' + Math.round(s.healRatio * 100) + '%');
    if (s.shieldRatio > 0) sub.push('🛡' + Math.round(s.shieldRatio * 100) + '%');
    if (s.element !== 'neutral') sub.push(ELEM_INFO[s.element].icon);
    if (s.aoe) sub.push('광역');
    if (s.applies) sub.push(STATUS_INFO[s.applies].icon);
    const onCd = s.cur > 0;
    cells.push('<button class="sk-act" id="btnSk' + i + '" onclick="btSkill(' + i + ')"' +
      ((enabled && !onCd) ? '' : ' disabled') + '>' +
      s.name + ' <span style="color:#ffd76a">Lv' + s.level + '</span>' +
      '<small>' + sub.join(' ') + ' · 쿨' + s.cooldown + '</small>' +
      (onCd ? '<span class="cd-mask">⏳' + s.cur + '</span>' : '') +
      '</button>');
  }
  bar.innerHTML = cells.join('');
}

function battleButtons(enabled) {
  ['btnAtk', 'btnDef', 'btnPot'].forEach(id => {
    const el = $(id);
    if (el) el.disabled = !enabled;
  });
  const pot = $('btnPot');
  if (pot) {
    pot.innerHTML = '🧪 포션 ×' + run.potions + '<small>HP 40%</small>';
    if (enabled && (run.potions <= 0 || run.player.hp >= run.player.maxHp)) pot.disabled = true;
  }
  // v5 소모품: 폭탄·연막탄은 전투 중 버튼 (턴을 소비하지 않는 즉시 사용)
  const bomb = $('btnBtBomb'), smoke = $('btnBtSmoke');
  if (bomb) {
    bomb.innerHTML = '💣 폭탄 ×' + run.bag.bomb + '<small>적 전체 ' + bombDamage(run.floor) + ' 피해</small>';
    bomb.disabled = !enabled || run.bag.bomb <= 0;
  }
  if (smoke) {
    smoke.innerHTML = '🌫 연막탄 ×' + run.bag.smoke +
      '<small>' + (bt && bt.isBoss ? '보스전 사용 불가' : '도주 — 보상·점령 없음') + '</small>';
    smoke.disabled = !enabled || run.bag.smoke <= 0 || (bt && bt.isBoss);
  }
  renderSkillBar(enabled);
}
function btMsg(t) {
  const el = $('btMsg');
  if (el) el.textContent = t;
}
function statusChips(unit) {
  return Object.keys(unit.st).map(k => {
    const s = STATUS_INFO[k], e = unit.st[k];
    return '<span class="chip ' + s.cls + '">' + s.icon + s.n +
      (e.stacks > 1 ? '×' + e.stacks : '') + '</span>';
  }).join('');
}
function renderChips(m, i) {
  const box = $('bt-chips-' + i);
  if (!box) return;
  let h = '';
  if (m.trait) { // 트레이트는 이름·아이콘으로 상시 노출 (깊이 v5)
    h += '<span class="chip trait">' + TRAITS[m.trait].icon + TRAITS[m.trait].n +
      (m.trait === 'shielded' && m.shieldedHits > 0 ? '×' + m.shieldedHits : '') +
      (m.trait === 'enrage' && m.hp > 0 && m.hp / m.maxHp < 0.5 ? '!' : '') + '</span>';
  }
  box.innerHTML = h + statusChips(m);
}
function updateBattleUI() {
  if (!bt) return;
  bt.monsters.forEach((m, i) => {
    const fill = $('bt-ehp-' + i), txt = $('bt-eht-' + i), box = $('bt-en-' + i);
    if (!fill) return;
    fill.style.width = Math.max(0, m.hp / m.maxHp * 100) + '%';
    txt.textContent = m.hp + ' / ' + m.maxHp;
    if (m.hp <= 0) box.classList.add('dead');
    renderChips(m, i);
  });
  const plChips = $('btPlChips');
  if (plChips) plChips.innerHTML = statusChips(run.player); // 플레이어 상태이상 (맹독 등)
  const p = run.player;
  const fill = $('btPhpFill'), txt = $('btPhpText'), shEl = $('btShield');
  if (fill) {
    const r = Math.max(0, p.hp / p.maxHp);
    fill.style.width = (r * 100) + '%';
    fill.style.background = r > 0.5 ? 'linear-gradient(90deg,#4fd06a,#8ce07a)'
      : r > 0.25 ? 'linear-gradient(90deg,#e0a03a,#f0c05a)' : 'linear-gradient(90deg,#d84848,#f07a5a)';
    txt.textContent = '❤️ ' + p.hp + ' / ' + p.maxHp;
  }
  if (shEl) shEl.textContent = bt.shield > 0 ? '🛡 ' + bt.shield : '';
  updateHUD();
}

function playerTurnStart() {
  if (!bt || bt.over) return;
  bt.defending = false;
  // 플레이어 턴 시작: 상태이상 틱 (맹독 몬스터가 중독을 건다 — InteractiveBattle.DoRound)
  const tick = tickStatuses(run.player);
  if (tick.damage > 0) {
    run.player.hp = Math.max(0, run.player.hp - tick.damage);
    floatText($('btPlRow'), '-' + tick.damage + ' ☠', 'dmg');
    log('☠ 상태이상 피해 -' + tick.damage);
    updateBattleUI();
    if (run.player.hp <= 0 && !btTryRevive()) { loseBattle(); return; }
  }
  if (tick.skip) {
    bt.locked = true;
    battleButtons(false);
    btMsg('💫 기절해서 움직일 수 없다!');
    updateBattleUI();
    setTimeout(afterPlayerAction, dur(600));
    return;
  }
  bt.locked = false;
  btMsg('▶ 당신의 턴');
  battleButtons(true);
  updateBattleUI();
}
function aliveMonsters() { return bt.monsters.filter(m => m.hp > 0); }

/* 부활 시도 (성직자 패시브, 런당 1회) — 성공 시 true */
function btTryRevive() {
  if (!run.reviveLeft) return false;
  run.reviveLeft = false;
  run.player.hp = Math.trunc(run.player.maxHp * bt.reviveRatio);
  floatText($('btPlRow'), '✨ 부활!', 'heal');
  btMsg('✨ 신앙의 힘으로 부활했다! HP ' + Math.round(bt.reviveRatio * 100) + '%');
  log('✨ 부활! (런당 1회)');
  updateBattleUI();
  return true;
}
/* 폭발 트레이트: 죽을 때 공격력 ×1.5 피해 — 반환 false = 플레이어 사망(전투 종료) */
function resolveDeathExplosion(dead) {
  if (dead.trait !== 'explosive') return true;
  const boom = Math.trunc(dead.atk * 1.5);
  run.player.hp = Math.max(0, run.player.hp - boom);
  flashHit($('btPlRow'));
  shake($('modalBox'));
  floatText($('btPlRow'), '💥 -' + boom, 'dmg');
  log('💥 ' + dead.name + '이(가) 폭발했다! -' + boom);
  updateBattleUI();
  if (run.player.hp > 0 || btTryRevive()) return true;
  loseBattle();
  return false;
}

/* ===== v5 소모품: 폭탄 (전투 중 즉시 사용, 턴 소비 없음) ===== */
function btBomb() {
  if (!bt || bt.locked || bt.over || run.bag.bomb <= 0) return;
  run.bag.bomb--;
  const dmg = bombDamage(run.floor);
  // C# RunController와 동일: 폭탄 피해는 트레이트(폭발) 유발 없이 정산
  for (const m of aliveMonsters()) {
    const idx = bt.monsters.indexOf(m);
    m.hp = Math.max(0, m.hp - dmg);
    flashHit($('bt-en-' + idx));
    floatText($('bt-en-' + idx), '-' + dmg, 'dmg');
    if (m.hp <= 0) {
      run.kills++;
      log('☠️ ' + m.name + ' — 폭탄에 휘말려 쓰러졌다!');
    }
  }
  shake($('modalBox'));
  btMsg('💣 폭탄! 적 전체 -' + dmg);
  log('💣 폭탄 투척! 적 전체 -' + dmg);
  updateBattleUI();
  if (aliveMonsters().length === 0) {
    bt.locked = true;
    battleButtons(false);
    bt.xpKills += 1; // 폭탄 전멸: 처치 1마리분 경험치 (RunController.Fight)
    winBattle();
    return;
  }
  battleButtons(!bt.locked);
}
/* ===== v5 소모품: 연막탄 (전투 1회 회피 — 보상·점령 없음, 보스 불가) ===== */
function btSmoke() {
  if (!bt || bt.locked || bt.over || bt.isBoss || run.bag.smoke <= 0) return;
  run.bag.smoke--;
  bt.over = true;
  bt.locked = true;
  battleButtons(false);
  btMsg('🌫 연막탄! 어둠 속으로 사라졌다...');
  log('🌫 연막탄으로 도주했다. (보상·점령 없음)');
  const cb = bt.onFlee;
  setTimeout(() => {
    bt = null;
    closeOverlay();
    updateHUD();
    cb();
  }, dur(700));
}

/* 플레이어 타격 (기본 공격 or 공격 스킬) — InteractiveBattle.PlayerStrike */
function playerStrike(skill) {
  const aoe = !!(skill && skill.aoe);
  // 타겟 우선순위: 치유사 > 저체력 (트레이트가 만드는 결정 — InteractiveBattle.PlayerStrike)
  const alive = aliveMonsters().slice().sort((a, b) =>
    (a.trait === 'healer' ? 0 : 1) - (b.trait === 'healer' ? 0 : 1) || a.hp - b.hp);
  const targets = aoe ? aliveMonsters() : alive.slice(0, 1);
  let msgParts = [];

  for (const t of targets) {
    const idx = bt.monsters.indexOf(t);
    const enEl = $('bt-en-' + idx);
    const r = computeDamage(run.player, t, skill, bt.critBonus);
    if (r.miss) {
      floatText(enEl, 'MISS', 'miss');
      msgParts.push(t.name + ' 회피!');
      continue;
    }
    let dmg = r.dmg;
    if (t.shieldedHits > 0) { // 장갑: 첫 2회 피격 절반
      dmg = Math.max(1, Math.trunc(dmg / 2));
      t.shieldedHits--;
      floatText(enEl, '🛡 장갑!', 'res');
    }
    t.hp = Math.max(0, t.hp - dmg);
    flashHit(enEl);
    shake($('modalBox'));
    if (r.crit) SFX.crit(); else SFX.hit();
    floatText(enEl, (r.crit ? '크리! -' : '-') + dmg, r.crit ? 'crit' : 'dmg');
    if (r.mult > 1) floatText(enEl, '효과적! ×' + r.mult, 'eff');
    else if (r.mult < 1) floatText(enEl, '비효과적 ×' + r.mult, 'res');
    msgParts.push(t.name + ' -' + dmg + (r.crit ? ' 크리!' : ''));

    if (t.hp > 0) {
      if (skill && skill.applies) {
        applyStatus(t, skill.applies, Math.max(1, skill.stacks));
      } else if (bt.burnOnHit > 0 && chance(bt.burnOnHit)) {
        applyStatus(t, 'burn', 1); // 룬 나이트 발화
        floatText(enEl, '🔥 발화!', 'eff');
      }
      // 인화 콤보: 화상 5중첩 도달 시 폭발 (중첩×6 즉발 + 화상 제거)
      const boom = tryDetonateBurn(t);
      if (boom > 0) {
        t.hp = Math.max(0, t.hp - boom);
        flashHit(enEl);
        floatText(enEl, '💥 인화! -' + boom, 'crit');
        log('💥 인화! ' + t.name + '의 화상이 폭발했다 (-' + boom + ')');
        msgParts.push('인화 -' + boom);
      }
    }
    if (t.hp <= 0) {
      run.kills++;
      bt.xpKills++;
      log('☠️ ' + t.name + ' 처치!');
      if (!resolveDeathExplosion(t)) { updateBattleUI(); return; } // 폭발 트레이트로 사망
    }
  }
  btMsg((skill ? '💫 ' + skill.name + '! ' : '⚔️ ') + msgParts.join(' / '));
  updateBattleUI();
}

function btAttack() {
  if (!bt || bt.locked) return;
  bt.locked = true;
  battleButtons(false);
  playerStrike(null);
  setTimeout(afterPlayerAction, dur(620));
}
function btSkill(i) {
  if (!bt || bt.locked) return;
  const s = run.skills[i];
  if (!s || s.cur > 0) return;
  bt.locked = true;
  battleButtons(false);
  s.cur = s.cooldown;
  if (s.healRatio > 0 || s.shieldRatio > 0) {
    // 회복/실드 스킬 (InteractiveBattle.DoRound Skill 분기)
    let msg = [];
    if (s.healRatio > 0) {
      const amt = Math.trunc(run.player.maxHp * s.healRatio);
      const real = Math.min(run.player.maxHp - run.player.hp, amt);
      run.player.hp = Math.min(run.player.maxHp, run.player.hp + amt);
      floatText($('btPlRow'), '+' + real, 'heal');
      SFX.heal();
      msg.push('HP +' + real);
    }
    if (s.shieldRatio > 0) {
      const gain = Math.trunc(run.player.maxHp * s.shieldRatio);
      bt.shield += gain;
      floatText($('btPlRow'), '🛡 +' + gain, 'info');
      msg.push('실드 +' + gain);
    }
    btMsg('💫 ' + s.name + '! ' + msg.join(' · '));
    updateBattleUI();
  } else {
    playerStrike(s);
  }
  setTimeout(afterPlayerAction, dur(620));
}
function btDefend() {
  if (!bt || bt.locked) return;
  bt.locked = true;
  battleButtons(false);
  bt.defending = true;
  btMsg('🛡️ 방어 태세! 받는 피해 50% 감소');
  log('🛡️ 방어 태세를 취했다.');
  setTimeout(afterPlayerAction, dur(420));
}
function btPotion() {
  if (!bt || bt.locked) return;
  if (run.potions <= 0 || run.player.hp >= run.player.maxHp) return;
  bt.locked = true;
  battleButtons(false);
  run.potions--;
  const amt = Math.trunc(run.player.maxHp * B.POTION_HEAL);
  const real = Math.min(run.player.maxHp - run.player.hp, amt);
  run.player.hp = Math.min(run.player.maxHp, run.player.hp + amt);
  floatText($('btPlRow'), '+' + real, 'heal');
  SFX.heal();
  btMsg('🧪 포션! HP +' + real);
  log('🧪 포션으로 HP ' + real + ' 회복');
  updateBattleUI();
  setTimeout(afterPlayerAction, dur(520));
}

/* 플레이어 행동 후: 승리 확인 → 몬스터 반격 → 쿨다운 감소 */
function afterPlayerAction() {
  if (!bt || bt.over) return;
  if (aliveMonsters().length === 0) { winBattle(); return; }
  const monstersSkip = bt.firstRound && bt.playerFirst;
  bt.firstRound = false;
  if (monstersSkip) {
    btMsg('✨ 선제공격! 몬스터가 반격하지 못한다');
    endRound();
    return;
  }
  monsterPhase();
}

function monsterPhase() {
  const list = aliveMonsters();
  let i = 0;
  const next = () => {
    if (!bt || bt.over) return;
    if (i >= list.length) { endRound(); return; }
    const m = list[i++];
    if (m.hp <= 0) { next(); return; }
    const idx = bt.monsters.indexOf(m);
    const enEl = $('bt-en-' + idx);

    // 턴 시작: 상태이상 도트/기절 (InteractiveBattle 몬스터 턴)
    const tick = tickStatuses(m);
    if (tick.damage > 0) {
      m.hp = Math.max(0, m.hp - tick.damage);
      floatText(enEl, '-' + tick.damage + ' ☠', 'dmg');
      updateBattleUI();
      if (m.hp <= 0) {
        run.kills++;
        bt.xpKills++;
        log('☠️ ' + m.name + ' — 상태이상으로 쓰러졌다!');
        btMsg('☠ ' + m.name + ' 도트 피해로 사망!');
        if (!resolveDeathExplosion(m)) return; // 폭발 트레이트
        setTimeout(next, T.MOB_GAP * 0.6);
        return;
      }
    }
    if (tick.skip) {
      floatText(enEl, '💫 기절!', 'info');
      btMsg('💫 ' + m.name + '은(는) 기절해서 움직이지 못한다!');
      updateBattleUI();
      setTimeout(next, T.MOB_GAP * 0.7);
      return;
    }

    // 치유사: 다친 동료(HP 60%↓)가 있으면 공격 대신 12% 회복 → 먼저 잡아야 함
    if (m.trait === 'healer') {
      const hurt = aliveMonsters().filter(x => x !== m && x.hp / x.maxHp < 0.6)
        .sort((a, b) => a.hp / a.maxHp - b.hp / b.maxHp)[0];
      if (hurt) {
        const heal = Math.trunc(hurt.maxHp * 0.12);
        hurt.hp = Math.min(hurt.maxHp, hurt.hp + heal);
        floatText($('bt-en-' + bt.monsters.indexOf(hurt)), '+' + heal, 'heal');
        btMsg('💚 ' + m.name + '이(가) ' + hurt.name + '을(를) 회복시켰다! +' + heal);
        updateBattleUI();
        setTimeout(next, T.MOB_GAP);
        return;
      }
    }

    const r = computeDamage(m, run.player, null, 0);
    if (r.miss) {
      floatText($('btPlRow'), 'MISS', 'miss');
      btMsg('💨 ' + m.name + '의 공격을 회피했다!');
      setTimeout(next, T.MOB_GAP * 0.7);
      return;
    }
    let dmg = r.dmg;
    let enraged = false;
    if (m.trait === 'enrage' && m.hp / m.maxHp < 0.5) { // 광폭: HP 50%↓ 공격 ×1.4
      dmg = Math.trunc(dmg * 1.4);
      enraged = true;
    }
    if (bt.defending) dmg = Math.max(1, Math.trunc(dmg / 2));
    const absorbed = Math.min(bt.shield, dmg);
    if (absorbed > 0) {
      bt.shield -= absorbed;
      floatText($('btPlRow'), '🛡 -' + absorbed, 'info');
    }
    const real = dmg - absorbed;
    run.player.hp = Math.max(0, run.player.hp - real);

    const plRow = $('btPlRow');
    flashHit(plRow);
    shake($('modalBox'));
    SFX.hit();
    if (real > 0) floatText(plRow, '-' + real, r.crit ? 'crit' : 'dmg');
    btMsg((enraged ? '😡 광폭화! ' : '💢 ') + m.name + '의 공격! -' + real +
      (absorbed > 0 ? ' (실드 ' + absorbed + ' 흡수)' : '') +
      (bt.defending ? ' (방어)' : '') + (r.crit ? ' 크리!' : ''));

    // 맹독: 공격마다 플레이어 중독 1중첩 → 장기전 금지
    if (m.trait === 'venomous' && run.player.hp > 0) {
      applyStatus(run.player, 'poison', 1);
      floatText(plRow, '🧪 중독!', 'eff');
    }
    updateBattleUI();

    if (run.player.hp <= 0) {
      if (btTryRevive()) {
        setTimeout(next, T.MOB_GAP);
        return;
      }
      loseBattle();
      return;
    }
    setTimeout(next, T.MOB_GAP);
  };
  setTimeout(next, dur(460));
}

function endRound() {
  if (!bt || bt.over) return;
  for (const s of run.skills) if (s.cur > 0) s.cur--;
  if (aliveMonsters().length === 0) { winBattle(); return; }
  setTimeout(playerTurnStart, dur(500));
}

function winBattle() {
  if (!bt || bt.over) return;
  bt.over = true;
  btMsg('🎉 승리!');
  const cb = bt.onWin;
  // 경험치: 처치 수 × (5+층×3) × 보스 5배 (RunController.GainBattleXp)
  const xp = bt.xpKills * B.monsterXp(run.floor) * (bt.isBoss ? B.BOSS_XP_MULT : 1);
  setTimeout(() => {
    bt = null;
    closeOverlay();
    if (xp > 0) {
      floatText($('token'), '+' + xp + ' XP', 'xp');
      const gained = gainXp(run.sheet, xp);
      log('✨ 경험치 +' + xp + (gained > 0 ? ' — 레벨 업!' : ''));
      updateHUD();
      if (gained > 0) { SFX.levelup(); processProgression(cb); return; }
    }
    cb();
  }, T.WIN_CLOSE);
}
function loseBattle() {
  if (!bt || bt.over) return;
  bt.over = true;
  btMsg('💀 쓰러졌다...');
  log('💀 전투에서 패배했다...');
  setTimeout(() => {
    bt = null;
    closeOverlay();
    die();
  }, dur(1000));
}

/* =====================================================================
 * PART E — 성장 UI (레벨업 배분 → 전직 → 스킬트리) + 층 클리어/결산
 * ===================================================================== */
let progressionDone = null; // 성장 체인 완료 후 콜백

function processProgression(done) {
  progressionDone = done || progressionDone || (() => endTurn());
  const sh = run.sheet;
  if (sh.statPoints > 0) { openLevelUp(); return; }
  if (canJobChange(sh)) { openJobChange(); return; }
  if (sh.points > 0 && skillPool(sh).some(d => canLearn(sh, d))) { openSkillTree(true); return; }
  finishProgression();
}
function finishProgression() {
  reequip();
  refreshPlayer();
  updateHUD();
  const done = progressionDone;
  progressionDone = null;
  closeOverlay();
  if (done) done();
}

/* ----- 레벨업 팝업: 6스탯 배분 (+3/레벨) ----- */
function openLevelUp() {
  uiMode = 'levelup';
  const sh = run.sheet;
  overlay(
    '<div class="m-title lv">🆙 레벨 업! — Lv.' + sh.level + '</div>' +
    '<div class="m-sub">' + jobName(sh) + ' — 스탯 포인트를 배분하세요 (레벨당 +3)</div>' +
    '<div class="alloc-pts">남은 포인트 <span id="allocLeft">' + sh.statPoints + '</span></div>' +
    '<div class="alloc-grid">' +
    STAT_IDS.map(k =>
      '<div class="alloc-row">' +
        '<div class="an">' + STAT_INFO[k].icon + ' ' + STAT_INFO[k].n +
          '<small>' + STAT_INFO[k].d + '</small></div>' +
        '<div class="av" id="alloc-' + k + '">' + sh.stats[k] + '</div>' +
        '<button class="alloc-plus" id="allocBtn-' + k + '" onclick="lvAlloc(\'' + k + '\')">+</button>' +
      '</div>').join('') +
    '</div>' +
    '<button class="m-btn gold" id="btnLvOk" onclick="lvConfirm()" disabled>확인 (포인트를 모두 배분하세요)</button>'
  );
  refreshAllocUI();
}
function refreshAllocUI() {
  const sh = run.sheet;
  const left = $('allocLeft');
  if (!left) return;
  left.textContent = sh.statPoints;
  STAT_IDS.forEach(k => {
    const v = $('alloc-' + k), b = $('allocBtn-' + k);
    if (v) v.textContent = sh.stats[k];
    if (b) b.disabled = sh.statPoints <= 0;
  });
  const ok = $('btnLvOk');
  if (ok) {
    ok.disabled = sh.statPoints > 0;
    ok.textContent = sh.statPoints > 0 ? '확인 (포인트를 모두 배분하세요)' : '✔ 확인';
  }
}
function lvAlloc(k) {
  const sh = run.sheet;
  if (sh.statPoints <= 0) return;
  sh.stats[k]++;
  sh.statPoints--;
  refreshAllocUI();
}
function lvConfirm() {
  if (run.sheet.statPoints > 0) return;
  refreshPlayer();
  processProgression();
}

/* ----- 전직: 레벨 8, 2택1 카드 ----- */
function openJobChange() {
  uiMode = 'jobchange';
  const paths = pathsFor(run.sheet.job);
  const bonusText = p => STAT_IDS.filter(k => p.bonus[k] > 0)
    .map(k => STAT_INFO[k].n + ' +' + p.bonus[k]).join(' · ');
  overlay(
    '<div class="m-title lv">⚜️ 전직의 시간!</div>' +
    '<div class="m-sub">레벨 ' + B.JOB_CHANGE_LEVEL + ' 달성 — 두 번째 직업을 선택하세요 (보너스 스탯 +10)</div>' +
    '<div class="jobcards">' +
    paths.map(p =>
      '<div class="jobcard" onclick="pickJob(\'' + p.id + '\')">' +
        '<div class="ji">' + p.icon + '</div>' +
        '<div class="jn">' + p.name + '</div>' +
        '<div class="jb">' + bonusText(p) + '</div>' +
        '<div class="jd">' + p.desc + '<br>' +
          p.tree.map(s => s.name).join(' · ') + '</div>' +
      '</div>').join('') +
    '</div>'
  );
}
function pickJob(pathKey) {
  if (!jobChange(run.sheet, pathKey)) return;
  const p = PATHS[pathKey];
  log('⚜️ ' + p.name + '(으)로 전직했다! (+10 보너스 스탯)');
  refreshPlayer();
  updateHUD();
  processProgression();
}

/* ----- 스킬트리: 선행 조건 잠금 표시, 포인트 학습 (레벨 1~5) ----- */
function openSkillTree(inChain) {
  uiMode = 'skilltree';
  renderSkillTree(inChain);
}
function renderSkillTree(inChain) {
  const sh = run.sheet;
  const equipped = new Set(equipActives(sh).map(s => s.defId));
  const section = (title, defs) =>
    '<div class="tree-sec">' + title + '</div>' +
    defs.map(def => {
      const lv = levelOf(sh, def.id);
      const lockText = def.prereqId && levelOf(sh, def.prereqId) < def.prereqLv
        ? '🔒 선행: ' + (skillPool(sh).find(d => d.id === def.prereqId) || { name: def.prereqId }).name + ' Lv.' + def.prereqLv + ' 필요'
        : '';
      const learnable = canLearn(sh, def);
      return '<div class="sk-row' + (lockText ? ' locked' : '') + '">' +
        '<div class="sk-icon">' + skillIcon(def) + '</div>' +
        '<div class="sk-body">' +
          '<div class="sk-name">' + def.name + ' <span class="sk-lv">Lv.' + lv + '/' + def.maxLv + '</span>' +
            (equipped.has(def.id) ? ' <span class="sk-eq">⭐장착</span>' : '') + '</div>' +
          '<div class="sk-desc">' + skillDesc(def, lv || 1) + '</div>' +
          (lockText ? '<div class="sk-lock">' + lockText + '</div>' : '') +
        '</div>' +
        (lv >= def.maxLv
          ? '<button class="sk-btn" disabled>MAX</button>'
          : '<button class="sk-btn" onclick="learnSk(\'' + def.id + '\')"' + (learnable ? '' : ' disabled') + '>배우기</button>') +
      '</div>';
    }).join('');

  let html =
    '<div class="m-title">📖 캐릭터 — ' + jobName(sh) + '</div>' +
    '<div class="tree-pts">스킬 포인트 <b>' + sh.points + '</b> (액티브는 계수 상위 ' + B.SKILL_SLOTS + '개 자동 장착)</div>' +
    section('1차 — ' + CHARS[sh.job].name, BASE_TREES[sh.job]);
  if (sh.advanced) html += section('2차 — ' + PATHS[sh.advanced].name, PATHS[sh.advanced].tree);
  // 장비 v2: 현재 장착 4슬롯 (등급 색상)
  html += '<div class="tree-sec">🎒 장비 — 4슬롯 (점수 높은 것 자동 장착, 하위품 매각)</div>' +
    SLOT_KEYS.map(k => {
      const e = run.loadout[k];
      return '<div class="sk-row">' +
        '<div class="sk-icon">' + SLOT_INFO[k].icon + '</div>' +
        '<div class="sk-body">' +
          '<div class="sk-name">' + SLOT_INFO[k].n + ' — ' +
            (e ? '<span class="rar' + e.rarity + '">' + gearDisplayName(e) + '</span>'
               : '<span style="color:#585174">비어 있음</span>') + '</div>' +
          '<div class="sk-desc">' + (e ? gearStatText(e) : '전투·보물·상점에서 획득') + '</div>' +
        '</div></div>';
    }).join('');
  html += '<button class="m-btn gold" onclick="closeTree()">' + (inChain ? '✔ 완료' : '닫기') + '</button>';
  overlay(html);
}
function learnSk(id) {
  const sh = run.sheet;
  const def = skillPool(sh).find(d => d.id === id);
  if (!def || !learnSkill(sh, def)) return;
  log('📖 ' + def.name + ' Lv.' + levelOf(sh, id) + ' 습득!');
  renderSkillTree(progressionDone != null);
}
function closeTree() {
  if (progressionDone) { finishProgression(); return; }
  reequip();
  refreshPlayer();
  updateHUD();
  closeOverlay();
  endTurn();
}
function openTreeFromBar() {
  if (busy || !run || !run.alive || uiMode !== 'idle') return;
  setBusy(true);
  uiMode = 'skilltree';
  openSkillTree(false);
}

/* =====================================================================
 * 층 클리어 / 하강·귀환 / 결산
 * ===================================================================== */
function floorClear() {
  run.floorsCleared = run.floor;
  const healed = healRatio(B.FLOOR_CLEAR_HEAL);
  log('🏆 ' + run.floor + '층 클리어! HP +' + healed + ' (35% 회복)');

  if (run.floor >= B.FINAL_FLOOR) {
    victory();
    return;
  }
  const nf = run.floor + 1;
  const p = run.player;
  uiMode = 'floorclear';
  overlay(
    '<div class="m-title">🏆 ' + run.floor + '층 클리어!</div>' +
    '<div class="m-sub">층 클리어 보상: HP 35% 회복 → ❤️ ' + p.hp + ' / ' + p.maxHp + '</div>' +
    '<div class="m-rows">' +
      '<div class="row"><span>다음 층</span><span>' + nf + '층 — ' + themeOf(nf).name + '</span></div>' +
      '<div class="row"><span>몬스터 속성</span><span>' + ELEM_INFO[floorElement(nf)].icon + ' ' +
        ELEM_INFO[floorElement(nf)].n + '</span></div>' +
      '<div class="row"><span>몬스터 HP / 공격</span><span>' + B.monsterHp(nf) + ' / ' + B.monsterAtk(nf) + '</span></div>' +
      '<div class="row"><span>현재 예상 소울스톤</span><span>💠 ' + calcStones(false) + '</span></div>' +
    '</div>' +
    '<button class="m-btn danger" onclick="descend()">⬇️ 하강 — 더 큰 보상, 사망 시 70%만 회수</button>' +
    '<button class="m-btn gold" onclick="retreat()">🏠 귀환 — 소울스톤 100% 회수</button>'
  );
  tutShow(4); // 튜토리얼 ⑤: 하강/귀환 선택
}
function descend() {
  closeOverlay();
  run.floor++;
  genFloor();
  updateHUD();
  log('⬇️ ' + run.floor + '층 — ' + themeOf(run.floor).name + '으로 하강했다.');
  endTurn();
}
function retreat() {
  closeOverlay();
  endRun(false, false);
}
function die() {
  run.alive = false;
  setBusy(true);
  SFX.death();
  endRun(true, false);
}
/* 소울스톤: (층×10 + 킬) × 영혼 수확기 × 어센션(+10%/Lv), 사망 시 70% (RunController.Play) */
function calcStones(died) {
  let stones = B.soulstonesForRun(run.floorsCleared, run.kills) * run.mods.soulMult * ascSoulMult(run.asc);
  if (died) stones *= B.DEATH_PENALTY;
  return Math.trunc(stones);
}

/* ===== v6: 15층 클리어 → 엔딩 연출 + 어센션 +1 (영구) ===== */
function victory() {
  uiMode = 'ending';
  setBusy(true);
  const prevAsc = meta.ascension | 0;
  meta.clears15 = (meta.clears15 | 0) + 1;
  if (prevAsc < ASC_MAX) meta.ascension = prevAsc + 1;
  saveMeta(); // 어센션은 결산 전에 즉시 영구 저장
  run.ascUp = (meta.ascension | 0) > prevAsc;
  SFX.victory();
  const n = meta.ascension | 0;
  const e = $('ending');
  e.innerHTML =
    '<div class="end-crown">👑</div>' +
    '<div class="end-title">심연 정복</div>' +
    '<div class="end-body">15층, 심연의 군주가 무너지고 던전 가장 깊은 곳에 빛이 스며든다.<br>' +
      '<b style="color:#ffd76a">' + jobName(run.sheet) + ' Lv.' + run.sheet.level + '</b> — 당신의 이야기는 마을의 전설이 되었다.<br>' +
      '하지만 주사위는 다시 구르고... 던전은 한층 더 깊고 어두워진다.</div>' +
    '<div class="end-asc">🔥 어센션 ' + n + (run.ascUp ? ' 달성!' : ' (최대)') +
      '<br><span style="font-size:11.5px;font-weight:600">다음 런부터 몬스터 HP +' + Math.round((ascHpMult(n) - 1) * 100) +
      '% · 공격 +' + Math.round((ascAtkMult(n) - 1) * 100) +
      '% / 결산 소울스톤 +' + Math.round((ascSoulMult(n) - 1) * 100) + '%</span></div>' +
    '<button class="m-btn gold" onclick="endingOk()">🏆 결산 보기</button>';
  e.classList.add('show');
}
function endingOk() {
  if (uiMode !== 'ending') return;
  const e = $('ending');
  e.classList.remove('show');
  e.innerHTML = '';
  endRun(false, true);
}
function endRun(died, victory) {
  setBusy(true);
  uiMode = 'result';
  const stones = calcStones(died);
  run.pendingStones = stones;
  run.died = died;

  const title = victory ? '🏆 심연 정복!' : died ? '💀 사망...' : '🏠 귀환 완료';
  const sub = victory ? '15층 최종 보스를 쓰러뜨렸다! 런 승리!'
    : died ? run.floor + '층에서 쓰러졌다. 소울스톤 70%만 회수한다.'
    : '무사히 마을로 돌아왔다. 소울스톤 100% 회수!';

  overlay(
    '<div class="m-title' + (died ? ' boss' : '') + '">' + title + '</div>' +
    '<div class="m-sub">' + sub + '</div>' +
    '<div class="m-rows">' +
      '<div class="row"><span>직업</span><span>' + jobName(run.sheet) + ' Lv.' + run.sheet.level + '</span></div>' +
      '<div class="row"><span>클리어한 층</span><span>' + run.floorsCleared + '층</span></div>' +
      '<div class="row"><span>처치한 몬스터</span><span>' + run.kills + '마리</span></div>' +
      '<div class="row"><span>획득 장비</span><span>' + run.gearCount + '개</span></div>' +
      '<div class="row"><span>주사위 굴림</span><span>' + run.diceRolls + '회</span></div>' +
      '<div class="row"><span>골드 (런 종료 시 소멸)</span><span>💰 ' + run.gold + '</span></div>' +
      (run.asc > 0 ? '<div class="row"><span>🔥 어센션 ' + run.asc + ' 보상 보너스</span><span>💠 +' +
        Math.round((ascSoulMult(run.asc) - 1) * 100) + '%</span></div>' : '') +
      '<div class="row"><span><b>소울스톤 획득</b></span><span><b style="color:#8fd0ff">💠 +' + stones +
        (died ? ' (70%)' : '') + '</b></span></div>' +
    '</div>' +

function backToTown() {
  meta.soul += run.pendingStones || 0;
  meta.totalRuns++;
  meta.totalKills = (meta.totalKills | 0) + run.kills;
  if (meta.charRuns[run.charId] != null) meta.charRuns[run.charId]++;
  if (run.floorsCleared > meta.bestFloor) meta.bestFloor = run.floorsCleared;
  saveMeta();
  run = null;
  bt = null;
  busy = false;
  uiMode = 'town';
  closeOverlay();
  renderTown();
  showScreen('town');
}

/* ----- 첫 런 튜토리얼: 코치마크 5단계 (localStorage 플래그, 단계별 최초 1회) ----- */
const TUT_STEPS = [
  { target: 'btnRoll',  text: '🎲 <b>주사위를 굴려</b> 나온 합만큼 시계 방향으로 이동해요.<br>보드의 한 칸 한 칸이 사건입니다.' },
  { target: 'btActions', text: '⚔️ 전투! <b>공격 · 스킬 · 방어 · 포션</b> 중 하나를 골라요.<br>스킬이 더 강하지만 쿨다운이 있어요.' },
  { target: 'board',    text: '🚩 전투에서 이긴 칸은 <b>점령</b>돼요.<br>다시 밟으면 회복되고, 점령이 많을수록 전투 시작 실드가 커져요.' },
  { target: 'bcHint',   text: '👑 보드를 <b>한 바퀴 완주</b>하면 이 층의 <b>보스</b>가 나타나요.<br>완주 보너스 골드도 두둑하게!' },
  { target: 'modalBox', text: '⬇️ <b>하강</b> — 더 깊이, 더 큰 보상. 단, 죽으면 소울스톤 70%만.<br>🏠 <b>귀환</b> — 지금까지 모은 소울스톤 100% 확보. 당신의 선택!' }
];
let tutStep = -1; // 현재 표시 중인 단계 (-1 = 없음)
function tutShow(step) {
  if (meta.tutorialDone || (meta.tutSeen & (1 << step))) return false;
  meta.tutSeen |= (1 << step);
  saveMeta();
  tutStep = step;
  const t = TUT_STEPS[step];
  $('coachTip').innerHTML =
    '<div class="coach-step">튜토리얼 ' + (step + 1) + ' / ' + TUT_STEPS.length + '</div>' +
    '<div class="coach-text">' + t.text + '</div>' +
    '<div class="coach-tap">▶ 탭해서 계속</div>' +
    '<button class="coach-skip" onclick="tutSkip(event)">다시 보지 않기</button>';
  $('coach').classList.add('show');
  positionCoach(t.target);
  return true;
}
function positionCoach(id) {
  const ring = $('coachRing'), tip = $('coachTip'), coach = $('coach');
  const target = $(id), app = $('app');
  try {
    const a = app.getBoundingClientRect(), r = target ? target.getBoundingClientRect() : null;
    if (!r || (!r.width && !r.height)) { // 타깃을 못 찾으면 링 없이 중앙 안내
      ring.style.display = 'none';
      coach.classList.add('noring');
      tip.style.top = '34%';
      return;
    }
    coach.classList.remove('noring');
    ring.style.display = 'block';
    ring.style.left = (r.left - a.left - 5) + 'px';
    ring.style.top = (r.top - a.top - 5) + 'px';
    ring.style.width = (r.width + 10) + 'px';
    ring.style.height = (r.height + 10) + 'px';
    const mid = r.top - a.top + r.height / 2;
    tip.style.top = mid > (a.height || 640) / 2
      ? Math.max(10, r.top - a.top - 190) + 'px'   // 타깃이 아래쪽 → 팁은 위
      : (r.top - a.top + r.height + 14) + 'px';    // 타깃이 위쪽 → 팁은 아래
  } catch (e) {
    ring.style.display = 'none';
    coach.classList.add('noring');
  }
}
function tutHide() {
  tutStep = -1;
  $('coach').classList.remove('show');
}
function tutTap() {
  if (tutStep < 0) return;
  const cur = tutStep;
  tutHide();
  SFX.tap();
  if (cur === 2 && tutShow(3)) return; // ③점령 → ④완주=보스 체인
  // 5단계를 전부 본 순간 완료 (덜 본 단계는 다음에 상황이 오면 1회 표시)
  if (!meta.tutorialDone && meta.tutSeen === (1 << TUT_STEPS.length) - 1) {
    meta.tutorialDone = true;
    saveMeta();
  }
}
function tutSkip(ev) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  meta.tutorialDone = true;
  saveMeta();
  tutHide();
}
function tutReset() { // 설정: 튜토리얼 다시 보기
  meta.tutorialDone = false;
  meta.tutSeen = 0;
  saveMeta();
}

/* v6: PWA — 등록 실패(파일로 직접 열기 등)는 조용히 무시, 단일 파일로도 완전 동작 */

    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
} catch (e) { /* no-op */ }

showScreen('title');
