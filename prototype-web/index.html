<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>다이스 던전 — 프로토타입 v4</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body {
  background:#07060c; color:#e8e4f0;
  font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  overscroll-behavior:none; touch-action:manipulation;
  -webkit-user-select:none; user-select:none;
}
button { font-family:inherit; cursor:pointer; border:none; color:inherit; }
button:disabled { opacity:.4; cursor:default; }

#app {
  position:relative; max-width:480px; margin:0 auto;
  min-height:100dvh; display:flex; flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%, #171226 0%, #0b0a14 55%, #07060c 100%);
  box-shadow:0 0 40px rgba(0,0,0,.8); overflow:hidden;
}
.screen { display:none; flex:1; flex-direction:column; min-height:100dvh; }
.screen.active { display:flex; }

/* ===== 마을 ===== */
#screen-town { padding:22px 16px 20px; gap:12px; max-height:100dvh; overflow-y:auto; }
.town-title { text-align:center; margin-top:4px; }
.town-title h1 { font-size:28px; letter-spacing:2px; color:#ffd76a; text-shadow:0 3px 14px rgba(255,180,60,.35); }
.town-title p { font-size:12px; color:#9a92b5; margin-top:5px; }
.panel {
  background:linear-gradient(180deg,#1e1930 0%,#181428 100%);
  border:1px solid #322b4d; border-radius:14px; padding:12px 14px;
}
.soul-panel { display:flex; align-items:center; justify-content:center; gap:8px; font-size:19px; font-weight:700; }
.soul-panel .num { color:#8fd0ff; }
.section-label { font-size:12px; color:#8f86ad; letter-spacing:1px; margin:2px 2px -6px; }
.charGrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.char-card {
  position:relative; border-radius:13px; padding:10px 8px 9px; text-align:center;
  background:linear-gradient(180deg,#241e3c,#1b1730); border:1.5px solid #38305a;
  transition:border-color .15s, box-shadow .15s;
}
.char-card .ci { font-size:32px; line-height:1.2; }
.char-card .cn { font-size:14.5px; font-weight:800; margin-top:2px; }
.char-card .cs { font-size:10.5px; color:#9a92b5; margin-top:3px; line-height:1.5; }
.char-card .cp { font-size:10px; color:#b8aef5; margin-top:2px; }
.char-card.sel { border-color:#ffd76a; box-shadow:0 0 14px rgba(255,215,106,.3); }
.char-card.sel::after { content:'✔ 출전'; position:absolute; top:6px; right:8px; font-size:10px; color:#ffd76a; font-weight:800; }
.char-card.locked { filter:grayscale(.7); opacity:.75; }
.char-card:active { transform:scale(.97); }
.unlock-tag { display:inline-block; margin-top:5px; font-size:11px; font-weight:800; color:#8fd0ff;
  background:rgba(90,150,255,.12); border:1px solid rgba(90,150,255,.4); border-radius:8px; padding:2px 8px; }
.stat-preview { font-size:13px; line-height:1.8; }
.stat-preview .row { display:flex; justify-content:space-between; }
.stat-preview .bonus { color:#7ee787; font-weight:700; }
.train-row { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; }
.train-row + .train-row { border-top:1px solid #2b2542; }
.train-info { font-size:13.5px; line-height:1.45; }
.train-info small { color:#9a92b5; display:block; font-size:11px; }
.train-btn {
  min-width:96px; min-height:44px; border-radius:12px; font-size:13px; font-weight:700;
  background:linear-gradient(180deg,#3d3260,#2c2547); border:1px solid #55488a; color:#e8e4f0;
}
.train-btn:not(:disabled):active { transform:scale(.96); }
.relic-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; }
.relic-row + .relic-row { border-top:1px solid #2b2542; }
.relic-info { font-size:13px; line-height:1.4; }
.relic-info small { color:#9a92b5; display:block; font-size:10.5px; }
.relic-info .rlv { color:#ffd76a; font-weight:800; }
.relic-btn {
  min-width:88px; min-height:40px; border-radius:10px; font-size:12px; font-weight:700;
  background:linear-gradient(180deg,#31527a,#24405f); border:1px solid #4a7cc0; color:#cfe6ff;
}
.relic-btn.maxed { background:#2a2542; border-color:#3c3260; color:#8f86ad; }
#btnStartRun {
  margin-top:6px; min-height:60px; border-radius:16px; font-size:19px; font-weight:800; letter-spacing:1px;
  background:linear-gradient(180deg,#f0b843,#c88a1e); color:#241703;
  box-shadow:0 6px 18px rgba(240,184,67,.3), inset 0 1px 0 rgba(255,255,255,.4); flex-shrink:0;
}
#btnStartRun:active { transform:scale(.98); }
.town-reset { text-align:center; font-size:11px; color:#585174; padding:4px; background:none; }

/* ===== 런 화면 ===== */
#screen-run { padding:10px 10px calc(12px + env(safe-area-inset-bottom)); gap:7px; }
.hud {
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  background:#181428; border:1px solid #2d2747; border-radius:12px; padding:8px 11px;
  font-size:13px; font-weight:700;
}
.hud .floor { color:#ffd76a; }
.hud .job { color:#b8aef5; font-size:12.5px; }
.hud .gold { color:#f5cf6b; }
.hud .soul { color:#8fd0ff; }
.xpbar { position:relative; height:13px; border-radius:7px; overflow:hidden; background:#1c1830; border:1px solid #322b4d; }
.xpfill { height:100%; width:0%; background:linear-gradient(90deg,#7a5cff,#b18aff); transition:width .3s ease; }
.xpbar span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:9.5px; font-weight:800; color:#e8e4f0; text-shadow:0 1px 2px rgba(0,0,0,.8); }
.hpwrap { display:flex; align-items:center; gap:8px; }
.hpbar {
  position:relative; flex:1; height:24px; border-radius:12px; overflow:hidden;
  background:#241f33; border:1px solid #3a3355;
}
.hpfill {
  height:100%; width:100%; border-radius:12px;
  background:linear-gradient(90deg,#4fd06a,#8ce07a);
  transition:width .35s ease, background .35s ease;
}
.hpbar span {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,.8);
}
.substats { font-size:11.5px; font-weight:700; color:#c9c2e2; white-space:nowrap; }

#boardWrap { position:relative; }
#board {
  position:relative; display:grid; aspect-ratio:1; gap:3px;
  grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr);
}
.tile {
  position:relative; display:flex; align-items:center; justify-content:center;
  border-radius:7px; font-size:clamp(13px,4.4vw,21px);
  background:#241f33; border:1px solid #34304a;
  transition:box-shadow .2s, background .3s;
}
.tile.start    { background:#37285e; border-color:#7a5cff; }
.tile.battle   { background:#3a2331; border-color:#5c3247; }
.tile.elite    { background:#481d24; border-color:#a53445; box-shadow:inset 0 0 8px rgba(230,70,80,.35); }
.tile.treasure { background:#41351a; border-color:#8a6d2f; }
.tile.shop     { background:#1d3542; border-color:#3f7a94; }
.tile.rest     { background:#42301f; border-color:#9a6a35; }
.tile.trap     { background:#2a3320; border-color:#5f7a3a; }
.tile.event    { background:#232a4a; border-color:#4a5aa0; }
.tile.captured { background:#1e3350; border-color:#4a7cc0; box-shadow:inset 0 0 8px rgba(90,150,255,.3); }
.tile.captured::after { content:'🚩'; position:absolute; top:-5px; right:-3px; font-size:12px; filter:drop-shadow(0 1px 2px #000); }
.tile.cur { outline:2px solid #ffd76a; box-shadow:0 0 12px rgba(255,215,106,.55); z-index:2; }

.board-center {
  grid-area:2 / 2 / 7 / 7; margin:5px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  background:radial-gradient(80% 80% at 50% 30%, #1b1530 0%, #120e20 100%);
  border:1px solid #2c2547; border-radius:12px; text-align:center; padding:6px;
}
.bc-theme { font-size:11px; color:#8f86ad; letter-spacing:1px; }
.bc-floor { font-size:24px; font-weight:800; color:#ffd76a; line-height:1; text-shadow:0 2px 10px rgba(255,180,60,.3); }
.bc-elem { font-size:10.5px; color:#9a92b5; }
.dicewrap { display:flex; gap:10px; margin-top:2px; }
.die {
  width:44px; height:44px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(180deg,#fdfbf4,#d9d3c5); color:#241f33;
  font-size:24px; font-weight:800;
  box-shadow:0 4px 10px rgba(0,0,0,.55), inset 0 -3px 0 rgba(0,0,0,.15);
  transition:transform .1s;
}
.die.rolling { animation:diceShake .1s infinite; }
@keyframes diceShake {
  0%   { transform:rotate(-9deg) translateY(-2px); }
  50%  { transform:rotate(8deg) translateY(2px); }
  100% { transform:rotate(-6deg) translateY(-1px); }
}
.die.landed { animation:diceLand .3s ease; }
@keyframes diceLand { 0%{transform:scale(1.35);} 60%{transform:scale(.92);} 100%{transform:scale(1);} }
.bc-badges { min-height:18px; display:flex; flex-direction:column; gap:3px; align-items:center; }
.badge {
  font-size:11px; font-weight:800; padding:2px 9px; border-radius:9px;
  background:rgba(255,215,106,.14); color:#ffd76a; border:1px solid rgba(255,215,106,.45);
  animation:badgePop .3s ease;
}
@keyframes badgePop { from{transform:scale(.5);opacity:0;} to{transform:scale(1);opacity:1;} }
.bc-hint { font-size:11px; color:#7b7398; }

#token {
  position:absolute; z-index:5; font-size:27px; left:0; top:0;
  transform:translate(-50%,-58%);
  transition:left .15s linear, top .15s linear;
  filter:drop-shadow(0 4px 5px rgba(0,0,0,.7));
  pointer-events:none;
}
#token.notrans { transition:none; }
#token.hopping { animation:hop .15s linear; }
@keyframes hop { 50% { margin-top:-7px; } }

#logPanel {
  background:#12101d; border:1px solid #262040; border-radius:10px;
  padding:7px 11px; min-height:60px; font-size:12px; line-height:1.55;
  display:flex; flex-direction:column; justify-content:flex-end;
}
#logPanel .l0 { opacity:.45; } #logPanel .l1 { opacity:.7; } #logPanel .l2 { opacity:1; }

.bottomBar { display:flex; gap:7px; margin-top:auto; }
#btnFieldPotion, #btnTree {
  min-width:68px; min-height:56px; border-radius:14px; font-size:13px; font-weight:800;
  background:linear-gradient(180deg,#33414f,#25303b); border:1px solid #4a6076; color:#bfe3ff;
}
#btnTree { background:linear-gradient(180deg,#4a3a68,#372b4e); border-color:#7a5cff; color:#d8c8ff; position:relative; }
#btnTree .pt-badge {
  position:absolute; top:-6px; right:-5px; min-width:19px; height:19px; border-radius:10px;
  background:#e05555; color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; padding:0 4px;
}
#btnRoll {
  flex:1; min-height:56px; border-radius:14px; font-size:18px; font-weight:800; letter-spacing:1px;
  background:linear-gradient(180deg,#8358e8,#5c39b8); color:#fff;
  border:1px solid #9d7cf0;
  box-shadow:0 5px 16px rgba(131,88,232,.35), inset 0 1px 0 rgba(255,255,255,.3);
}
#btnRoll:not(:disabled):active, #btnFieldPotion:not(:disabled):active, #btnTree:not(:disabled):active { transform:scale(.97); }

/* ===== 오버레이 / 모달 ===== */
#overlay {
  position:absolute; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center; padding:14px;
  background:rgba(5,4,10,.78); backdrop-filter:blur(2px);
}
#overlay.show { display:flex; }
.modal {
  width:100%; max-width:430px; border-radius:18px; padding:16px 15px;
  background:linear-gradient(180deg,#221c38 0%,#171226 100%);
  border:1px solid #3c3260; box-shadow:0 14px 42px rgba(0,0,0,.7);
  animation:modalPop .22s ease; text-align:center;
  max-height:94dvh; overflow-y:auto;
}
@keyframes modalPop { from{transform:scale(.85) translateY(14px);opacity:0;} to{transform:scale(1) translateY(0);opacity:1;} }
.modal.shaking { animation:shake .3s linear; }
@keyframes shake {
  0%,100% { transform:translate(0,0); }
  20% { transform:translate(-7px,3px); }
  40% { transform:translate(7px,-3px); }
  60% { transform:translate(-5px,-2px); }
  80% { transform:translate(5px,2px); }
}
#boardWrap.shaking { animation:shake .3s linear; }
.m-title { font-size:19px; font-weight:800; margin-bottom:4px; }
.m-title.boss { color:#ff7a6a; text-shadow:0 0 14px rgba(255,90,70,.45); }
.m-title.lv { color:#ffd76a; }
.m-sub { font-size:12.5px; color:#9a92b5; margin-bottom:8px; }
.m-badges { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; min-height:0; margin-bottom:6px; }
.m-rows { text-align:left; font-size:14px; line-height:2.05; margin:8px 4px 10px; }
.m-rows .row { display:flex; justify-content:space-between; border-bottom:1px dashed #2e2749; }
.m-btn {
  width:100%; min-height:52px; border-radius:13px; font-size:15.5px; font-weight:800; margin-top:8px;
  background:linear-gradient(180deg,#8358e8,#5c39b8); color:#fff; border:1px solid #9d7cf0;
}
.m-btn.gold { background:linear-gradient(180deg,#f0b843,#c88a1e); color:#241703; border-color:#ffdf94; }
.m-btn.dark { background:linear-gradient(180deg,#3a3355,#2a2542); border-color:#4c4472; }
.m-btn.danger { background:linear-gradient(180deg,#d15050,#a12f2f); border-color:#ea8a8a; }
.m-btn:not(:disabled):active { transform:scale(.98); }

/* 레벨업 배분 */
.alloc-pts { font-size:15px; font-weight:800; color:#ffd76a; margin:4px 0 8px; }
.alloc-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.alloc-row {
  display:flex; align-items:center; justify-content:space-between; gap:6px;
  background:#1c1830; border:1px solid #322b4d; border-radius:11px; padding:7px 8px 7px 11px;
}
.alloc-row .an { font-size:13px; font-weight:700; text-align:left; }
.alloc-row .an small { display:block; font-size:9.5px; color:#8f86ad; font-weight:400; }
.alloc-row .av { font-size:15px; font-weight:800; color:#e8e4f0; }
.alloc-plus {
  width:38px; height:38px; border-radius:10px; font-size:19px; font-weight:800;
  background:linear-gradient(180deg,#8358e8,#5c39b8); color:#fff; border:1px solid #9d7cf0;
}
.alloc-plus:not(:disabled):active { transform:scale(.92); }

/* 전직 카드 */
.jobcards { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:8px 0 4px; }
.jobcard {
  border-radius:14px; padding:13px 9px; text-align:center;
  background:linear-gradient(180deg,#2b2348,#1e1934); border:1.5px solid #4c3f80;
  transition:transform .1s;
}
.jobcard:active { transform:scale(.96); }
.jobcard .ji { font-size:36px; }
.jobcard .jn { font-size:15px; font-weight:800; color:#ffd76a; margin-top:4px; }
.jobcard .jb { font-size:10.5px; color:#8fd0ff; margin-top:5px; font-weight:700; }
.jobcard .jd { font-size:10.5px; color:#9a92b5; margin-top:5px; line-height:1.55; }

/* 스킬트리 */
.tree-pts { font-size:14px; font-weight:800; color:#8fd0ff; margin-bottom:6px; }
.tree-sec { font-size:11px; color:#8f86ad; letter-spacing:1px; text-align:left; margin:8px 2px 3px; }
.sk-row {
  display:flex; align-items:center; gap:8px; padding:7px 2px;
  border-bottom:1px dashed #2e2749; text-align:left;
}
.sk-row.locked { opacity:.5; }
.sk-icon { font-size:22px; width:30px; text-align:center; flex-shrink:0; }
.sk-body { flex:1; min-width:0; }
.sk-name { font-size:13.5px; font-weight:800; }
.sk-name .sk-lv { color:#ffd76a; font-size:12px; }
.sk-name .sk-eq { color:#7ee787; font-size:10.5px; font-weight:800; }
.sk-desc { font-size:10.5px; color:#9a92b5; line-height:1.45; margin-top:1px; }
.sk-lock { font-size:10px; color:#e08a8a; margin-top:1px; font-weight:700; }
.sk-btn {
  min-width:58px; min-height:40px; border-radius:10px; font-size:12.5px; font-weight:800; flex-shrink:0;
  background:linear-gradient(180deg,#2e7a4f,#1e5236); border:1px solid #6cc094; color:#d2f5df;
}

/* 전투 */
.enemyRow { display:flex; gap:8px; justify-content:center; margin:6px 0 4px; }
.enemy { flex:1; max-width:150px; transition:opacity .4s, filter .4s; }
.enemy.dead { opacity:.22; filter:grayscale(1); }
.e-sprite { font-size:48px; line-height:1.15; transition:transform .12s, filter .12s; display:inline-block; }
.e-sprite.boss { font-size:64px; }
.hitflash .e-sprite { filter:brightness(2.6) saturate(.3); transform:scale(1.12) rotate(-6deg); }
.e-name { font-size:11.5px; color:#c9c2e2; font-weight:700; margin-top:2px; }
.ehp { height:9px; border-radius:5px; background:#241f33; border:1px solid #443b60; overflow:hidden; margin-top:4px; }
.ehpfill { height:100%; background:linear-gradient(90deg,#e05555,#f08a6a); transition:width .3s ease; }
.ehptext { font-size:10px; color:#9a92b5; margin-top:2px; }
.chips { min-height:16px; display:flex; gap:3px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
.chip {
  font-size:9.5px; font-weight:800; border-radius:8px; padding:1px 5px;
  background:rgba(255,120,80,.15); border:1px solid rgba(255,120,80,.4); color:#ffb59d;
}
.chip.poison { background:rgba(120,220,90,.12); border-color:rgba(120,220,90,.4); color:#a8e88f; }
.chip.freeze { background:rgba(120,190,255,.12); border-color:rgba(120,190,255,.4); color:#a8d8ff; }
.chip.stun   { background:rgba(255,220,90,.12); border-color:rgba(255,220,90,.45); color:#ffe9a0; }
#btMsg { min-height:20px; font-size:13px; font-weight:700; color:#ffd76a; margin:5px 0; }
.pl-row { display:flex; align-items:center; gap:10px; margin:4px 2px 8px; }
.pl-sprite { font-size:38px; transition:transform .12s, filter .12s; }
.pl-row.hitflash .pl-sprite { filter:brightness(2.4); transform:scale(1.08) rotate(5deg); }
.pl-hp { flex:1; }
.pl-shield { font-size:11px; font-weight:800; color:#8fd0ff; min-width:44px; text-align:right; }
.skillbar { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:7px; }
.sk-act {
  position:relative; min-height:52px; border-radius:12px; font-size:12.5px; font-weight:800; line-height:1.25;
  border:1px solid #7a5cff; background:linear-gradient(180deg,#463672,#332853); overflow:hidden;
}
.sk-act small { display:block; font-size:9px; font-weight:600; opacity:.8; }
.sk-act .cd-mask {
  position:absolute; inset:0; background:rgba(8,6,16,.72);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; color:#b8aef5;
}
.sk-act:not(:disabled):active { transform:scale(.96); }
.sk-act.empty { background:#1c1830; border-color:#2b2542; color:#585174; }
.actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; }
.act-btn {
  min-height:52px; border-radius:13px; font-size:14px; font-weight:800; line-height:1.3;
  border:1px solid #55488a; background:linear-gradient(180deg,#3d3260,#2c2547);
}
.act-btn.atk { background:linear-gradient(180deg,#c04848,#8e2c2c); border-color:#e88a8a; }
.act-btn.def { background:linear-gradient(180deg,#3a5f8a,#28425f); border-color:#7aa8d8; }
.act-btn.pot { background:linear-gradient(180deg,#2e7a4f,#1e5236); border-color:#6cc094; }
.act-btn:not(:disabled):active { transform:scale(.96); }
.act-btn small { display:block; font-size:10px; font-weight:600; opacity:.85; }

/* 상점 */
.shop-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px dashed #2e2749; }
.shop-item .info { text-align:left; font-size:14px; font-weight:700; }
.shop-item .info small { display:block; font-size:11px; color:#9a92b5; font-weight:400; }
.buy-btn {
  min-width:96px; min-height:46px; border-radius:11px; font-weight:800; font-size:13.5px;
  background:linear-gradient(180deg,#f0b843,#c88a1e); color:#241703;
}

/* 플로팅 텍스트 */
#floats { position:absolute; inset:0; z-index:70; pointer-events:none; overflow:hidden; }
.float {
  position:absolute; transform:translate(-50%,-50%); font-weight:900; font-size:17px;

  stun:   { icon:'💫', n:'기절', cls:'stun' }
};
const STATUS_DUR = { burn:2, poison:3, freeze:2, stun:1 };

function applyStatus(unit, type, stacks) {
  if (!unit.st[type]) unit.st[type] = { dur:0, stacks:0 };
  unit.st[type].dur = STATUS_DUR[type];       // 지속시간 리셋
  unit.st[type].stacks += (stacks || 1);      // 중첩 누적
}
/* 턴 시작 처리 → { damage, skip } (고정 도트: 화상 4×중첩, 중독 3×중첩) */
function tickStatuses(unit) {
  let damage = 0, skip = false;
  if (unit.st.burn)   damage += 4 * unit.st.burn.stacks;
  if (unit.st.poison) damage += 3 * unit.st.poison.stacks;
  if (unit.st.stun) { skip = true; delete unit.st.stun; }
  for (const k of Object.keys(unit.st)) {
    unit.st[k].dur--;
    if (unit.st[k].dur <= 0) delete unit.st[k];
  }
  return { damage, skip };
}

/* RelicModifiers.From 이식 */
function relicMods(levels) {
  const m = { startGold:0, startPotions:0, restHealBonus:0, captureHealBonus:0,
              trapAvoidBonus:0, bonusAtk:0, bonusDef:0, bonusHp:0, bonusCrit:0,
              shopDiscount:0, soulMult:1.0, lapGoldMult:1.0 };
  for (let i = 0; i < RELICS.length; i++) {
    const lv = (levels && levels[i]) | 0;
    if (lv <= 0) continue;
    switch (RELICS[i].key) {
      case 'startGold':   m.startGold += 30 * lv; break;
      case 'startPotion': m.startPotions += Math.min(lv, 3); break;
      case 'restHeal':    m.restHealBonus += 0.05 * lv; break;
      case 'captureHeal': m.captureHealBonus += 0.03 * lv; break;
      case 'trapSense':   m.trapAvoidBonus += 0.08 * lv; break;
      case 'atkCore':     m.bonusAtk += 2 * lv; break;
      case 'defCore':     m.bonusDef += 1 * lv; break;
      case 'vitalCore':   m.bonusHp += 15 * lv; break;
      case 'luckyCharm':  m.bonusCrit += 0.02 * lv; break;
      case 'bargain':     m.shopDiscount += 0.05 * lv; break;
      case 'soulHarvest': m.soulMult += 0.08 * lv; break;
      case 'bossTrophy':  m.lapGoldMult += 0.25 * lv; break;
    }
  }
  return m;
}

/* ----- CharacterSheet.cs ----- */
const xpToLevel = lv => Math.trunc(14 * Math.pow(lv, 1.25));

function newSheet(charId) {
  return {
    job: charId, advanced: null,          // advanced: PATHS 키
    level: 1, xp: 0,
    stats: Object.assign({}, CHARS[charId].base),
    learned: {},                          // skillId -> level
    points: 1,                            // 시작 스킬 1개
    statPoints: 0,
    gearAtk: 0, gearDef: 0, gearHp: 0
  };
}
/* 경험치 획득 → 오른 레벨 수 (레벨당 스탯+3, 스킬+1) */
function gainXp(sheet, amount) {
  sheet.xp += amount;
  let gained = 0;
  while (sheet.xp >= xpToLevel(sheet.level)) {
    sheet.xp -= xpToLevel(sheet.level);
    sheet.level++;
    gained++;
    sheet.statPoints += 3;
    sheet.points++;
  }
  return gained;
}
const canJobChange = sheet => sheet.level >= B.JOB_CHANGE_LEVEL && !sheet.advanced;
function jobChange(sheet, pathKey) {
  const p = PATHS[pathKey];
  if (!canJobChange(sheet) || p.parent !== sheet.job) return false;
  sheet.advanced = pathKey;
  for (const k of STAT_IDS) sheet.stats[k] += (p.bonus[k] || 0);
  return true;
}
function skillPool(sheet) {
  const pool = BASE_TREES[sheet.job].slice();
  if (sheet.advanced) pool.push(...PATHS[sheet.advanced].tree);
  return pool;
}
const levelOf = (sheet, id) => sheet.learned[id] || 0;
function canLearn(sheet, def) {
  if (sheet.points <= 0) return false;
  if (levelOf(sheet, def.id) >= def.maxLv) return false;
  if (def.prereqId && levelOf(sheet, def.prereqId) < def.prereqLv) return false;
  return true;
}
function learnSkill(sheet, def) {
  if (!canLearn(sheet, def)) return false;
  sheet.points--;
  sheet.learned[def.id] = levelOf(sheet, def.id) + 1;
  return true;
}
/* 시뮬레이션 자동 학습: 2차 트리 우선, 선행 충족되는 것부터 (CharacterSheet.AutoLearnSkills) */
function autoLearnSkills(sheet) {
  let learned = true;
  while (learned && sheet.points > 0) {
    learned = false;
    const ordered = sheet.advanced
      ? PATHS[sheet.advanced].tree.concat(BASE_TREES[sheet.job])
      : BASE_TREES[sheet.job];
    for (const def of ordered) {
      if (canLearn(sheet, def)) { learnSkill(sheet, def); learned = true; break; }
    }
  }
}
function passiveSum(sheet, type) {
  let sum = 0;
  for (const def of skillPool(sheet)) {
    const lv = levelOf(sheet, def.id);
    if (lv > 0 && def.passive === type) sum += def.passiveValue * lv;
  }
  return sum;
}
/* 액티브 장착: 계수 상위 3개 자동 (SkillBook.EquipActives 정렬식 그대로) */
function equipScore(def, lv) {
  return (def.coef + def.coefPerLv * (lv - 1)) * (def.aoe ? 1.3 : 1)
       + (def.healBase + def.healPerLv * (lv - 1)) * 2;
}
function equipActives(sheet) {
  return skillPool(sheet)
    .filter(d => !isPassive(d) && levelOf(sheet, d.id) > 0)
    .sort((a, b) => equipScore(b, levelOf(sheet, b.id)) - equipScore(a, levelOf(sheet, a.id)))
    .slice(0, B.SKILL_SLOTS)
    .map(d => instantiateSkill(d, levelOf(sheet, d.id)));
}
/* SkillDef.Instantiate */
function instantiateSkill(def, lv) {
  return {
    defId: def.id, name: def.name, level: lv,
    cooldown: def.cooldown, cur: 0,
    coef: def.coef > 0 ? def.coef + def.coefPerLv * (lv - 1) : 0,
    aoe: def.aoe, magic: def.magic, element: def.element,
    applies: def.applies, stacks: Math.max(1, def.stacksPerLv * lv),
    healRatio: def.healBase > 0 ? def.healBase + def.healPerLv * (lv - 1) : 0,
    shieldRatio: def.shieldRatio
  };
}
/* CharacterSheet.Refresh — 유일한 파생 재계산 지점 */
function refreshUnit(sheet, unit, bonus) {
  const s = sheet.stats, cls = CHARS[sheet.job];
  const newMaxHp = D.maxHp(s) + sheet.gearHp + bonus.hp;
  const hpGain = newMaxHp - unit.maxHp;
  unit.maxHp = newMaxHp;
  if (hpGain > 0) unit.hp = Math.min(unit.maxHp, unit.hp + hpGain);
  else unit.hp = Math.min(unit.hp, unit.maxHp);

  unit.atk  = D.atk(s)  + sheet.gearAtk + bonus.atk + Math.trunc(passiveSum(sheet, 'atkFlat'));
  unit.matk = D.matk(s) + sheet.gearAtk + bonus.atk + Math.trunc(passiveSum(sheet, 'matkFlat'));
  unit.def  = D.def(s)  + sheet.gearDef + bonus.def + Math.trunc(passiveSum(sheet, 'defFlat'));
  unit.mdef = D.mdef(s) + Math.trunc(sheet.gearDef / 2) + Math.trunc(bonus.def / 2);
  unit.spd  = D.spd(s);
  unit.crit = D.crit(s) + bonus.crit + passiveSum(sheet, 'critPct');
  unit.evasion  = D.evasion(s) + cls.evasion + passiveSum(sheet, 'evadePct');
  unit.accuracy = D.accuracy(s);
}
function buildUnit(sheet, bonus) {
  const unit = { name: CHARS[sheet.job].name, maxHp:0, hp:0, atk:0, matk:0, def:0, mdef:0,
                 spd:0, crit:0, evasion:0, accuracy:0.9, element:'neutral', st:{} };
  refreshUnit(sheet, unit, bonus);
  unit.hp = unit.maxHp;
  return unit;
}
const burnOnHitChance   = sheet => passiveSum(sheet, 'burnOnHitPct');
const hasCaptureTriple  = sheet => passiveSum(sheet, 'captureShieldTriple') > 0;
const hasReviveBoost    = sheet => passiveSum(sheet, 'reviveBoost') > 0;
const jobName = sheet => sheet.advanced ? PATHS[sheet.advanced].name : CHARS[sheet.job].name;

/* ----- DamageCalc.cs: 명중/회피 → 물리·마법 → 속성 → 크리 ----- */
function computeDamage(attacker, defender, skill, critBonus) {
  const hitChance = Math.max(0.5, Math.min(1.0, attacker.accuracy - defender.evasion));
  if (!chance(hitChance)) return { miss:true, dmg:0, crit:false, mult:1 };

  const magic = !!(skill && skill.magic);
  const atkStat = magic ? attacker.matk : attacker.atk;
  const defStat = magic ? defender.mdef : defender.def;
  const coef = (skill && skill.coef > 0) ? skill.coef : 1.0;
  const element = skill ? skill.element : 'neutral';
  const mult = elemMult(element, defender.element);

  let dmg = atkStat * coef * (100 / (100 + defStat)) * mult;
  const crit = chance(attacker.crit + critBonus);
  if (crit) dmg *= B.CRIT_MULT;

  return { miss:false, dmg: Math.max(1, Math.round(dmg)), crit, mult };
}

/* ----- 스킬 설명 헬퍼 ----- */
function skillDesc(def, lv) {
  const L = Math.max(1, lv);
  const parts = [];
  if (isPassive(def)) {
    const v = def.passiveValue * L;
    switch (def.passive) {
      case 'atkFlat':  parts.push('물리 공격 +' + v); break;
      case 'matkFlat': parts.push('마법 공격 +' + v); break;
      case 'defFlat':  parts.push('방어 +' + v); break;
      case 'critPct':  parts.push('크리 확률 +' + Math.round(v * 100) + '%p'); break;
      case 'evadePct': parts.push('회피 +' + Math.round(v * 100) + '%p'); break;
      case 'burnOnHitPct': parts.push('타격 시 화상 ' + Math.round(v * 100) + '%'); break;
      case 'captureShieldTriple': parts.push('점령 칸 실드 3배'); break;
      case 'reviveBoost': parts.push('부활 시 HP 70%'); break;
    }
    parts.push('패시브');
  } else {
    if (def.coef > 0) {
      parts.push((def.magic ? '마법' : '물리') + ' ' + Math.round((def.coef + def.coefPerLv * (L - 1)) * 100) + '%');
      if (def.element !== 'neutral') parts.push(ELEM_INFO[def.element].icon + ELEM_INFO[def.element].n);
      if (def.aoe) parts.push('광역');
    }
    if (def.healBase > 0) parts.push('회복 ' + Math.round((def.healBase + def.healPerLv * (L - 1)) * 100) + '%');
    if (def.shieldRatio > 0) parts.push('실드 ' + Math.round(def.shieldRatio * 100) + '%');
    if (def.applies) parts.push(STATUS_INFO[def.applies].icon + STATUS_INFO[def.applies].n
      + (def.stacksPerLv > 1 ? ' ×' + Math.max(1, def.stacksPerLv * L) : ''));
    parts.push('쿨 ' + def.cooldown);
  }
  return parts.join(' · ');
}
function skillIcon(def) {
  if (isPassive(def)) return '📘';
  if (def.healBase > 0) return '✚';
  if (def.shieldRatio > 0) return '🛡';
  if (def.element !== 'neutral') return ELEM_INFO[def.element].icon;
  return def.magic ? '🔮' : '⚔️';
}

const $ = id => document.getElementById(id);

function showScreen(name) {

function floatText(el, text, cls) {
  if (!el) return;
  const appRect = $('app').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'float ' + (cls || '');
  s.textContent = text;
  s.style.left = (r.left - appRect.left + r.width / 2) + 'px';
  s.style.top  = (r.top  - appRect.top  + r.height * 0.28) + 'px';
  $('floats').appendChild(s);
  setTimeout(() => s.remove(), 1000);
}

  if (!el) return;
  el.classList.remove('shaking');

/* ----- 저장 스키마: v1 { soul, hp, atk, def } → v2 (version 필드) ----- */
const SAVE_KEY = 'diceDungeonMeta_v1';
function defaultMeta() {
  return {
    version: 2,
    soul: 0,
    train: { hp:0, atk:0, def:0 },
    relics: new Array(RELICS.length).fill(0),
    unlocked: { rogue:false, mage:false, cleric:false },  // 기사는 기본
    selected: 'knight',
    totalRuns: 0, bestFloor: 0
  };
}
let meta = defaultMeta();
function migrateMeta(m) {
  if (!m || typeof m !== 'object') return defaultMeta();
  if (!m.version) {
    // v1 → v2: 소울스톤·훈련 레벨 보존
    const v2 = defaultMeta();
    v2.soul = m.soul | 0;
    v2.train = { hp: m.hp | 0, atk: m.atk | 0, def: m.def | 0 };
    return v2;
  }
  // v2: 결손 필드 보강
  const d = defaultMeta();
  m.train = Object.assign(d.train, m.train || {});
  m.unlocked = Object.assign(d.unlocked, m.unlocked || {});
  if (!Array.isArray(m.relics)) m.relics = d.relics;
  while (m.relics.length < RELICS.length) m.relics.push(0);
  if (!CHAR_ORDER.includes(m.selected)) m.selected = 'knight';
  m.soul = m.soul | 0;
  m.totalRuns = m.totalRuns | 0;
  m.bestFloor = m.bestFloor | 0;
  return m;
}
function loadMeta() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    meta = migrateMeta(raw ? JSON.parse(raw) : null);
  } catch (e) { meta = defaultMeta(); }
}
function saveMeta() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) { /* private mode */ }
}
function resetMeta() {
  if (!confirm('메타 성장(소울스톤·훈련·유물·해금)을 모두 초기화할까요?')) return;
  meta = defaultMeta();
  saveMeta();
  renderTown();
}
const isUnlocked = id => id === 'knight' || !!meta.unlocked[id];
function trainBonus() {
  return { hp: meta.train.hp * TRAIN.hp.gain, atk: meta.train.atk * TRAIN.atk.gain, def: meta.train.def * TRAIN.def.gain };
}
/* 런 시작 보정치 집계 = 훈련소 + 유물 (RunConfig.From) */
function runBonus() {
  const t = trainBonus(), m = relicMods(meta.relics);
  return { hp: t.hp + m.bonusHp, atk: t.atk + m.bonusAtk, def: t.def + m.bonusDef, crit: m.bonusCrit, mods: m };
}

/* =====================================================================

  /* 출전 정보: 선택 캐릭터 Lv1 파생 스탯 미리보기 */

  $('statPreview').innerHTML =
    '<div class="row"><span>' + c.icon + ' <b>' + c.name + '</b> (6스탯 합 ' +
      STAT_IDS.reduce((a, k) => a + s[k], 0) + ')</span><span>' +
      STAT_IDS.map(k => STAT_INFO[k].n + ' ' + s[k]).slice(0, 3).join(' · ') + '</span></div>' +
    '<div class="row"><span></span><span>' +
      STAT_IDS.map(k => STAT_INFO[k].n + ' ' + s[k]).slice(3).join(' · ') + '</span></div>' +
    '<div class="row"><span>❤️ HP</span><span>' + D.maxHp(s) + bonusTag(bn.hp) + '</span></div>' +
    '<div class="row"><span>⚔️ 물리 / 🔮 마법</span><span>' + D.atk(s) + bonusTag(bn.atk) +
      ' / ' + D.matk(s) + bonusTag(bn.atk) + '</span></div>' +
    '<div class="row"><span>🛡️ 방어 / 마방</span><span>' + D.def(s) + bonusTag(bn.def) +
      ' / ' + D.mdef(s) + '</span></div>' +
    '<div class="row"><span>🧪 포션</span><span>' + (B.START_POTIONS + bn.mods.startPotions) + '개</span></div>' +
    (bn.mods.startGold ? '<div class="row"><span>💰 시작 골드</span><span class="bonus">+' + bn.mods.startGold + '</span></div>' : '') +
    '<div class="row"><span>📊 최고 기록</span><span>' + meta.bestFloor + '층 · ' + meta.totalRuns + '런</span></div>';
}
function tapChar(id) {
  if (isUnlocked(id)) {
    meta.selected = id;
    saveMeta();
    renderTown();
    return;
  }
  if (meta.soul < UNLOCK_COST) return; // 소울스톤 부족
  meta.soul -= UNLOCK_COST;
  meta.unlocked[id] = true;
  meta.selected = id;
  saveMeta();
  renderTown();
}
function train(stat) {
  const cost = trainCost(meta.train[stat]);
  if (meta.soul < cost) return;
  meta.soul -= cost;
  meta.train[stat]++;
  saveMeta();
  renderTown();
}
function buyRelic(i) {
  const lv = meta.relics[i];
  if (lv >= RELIC_MAX) return;
  const cost = relicCost(lv);
  if (meta.soul < cost) return;
  meta.soul -= cost;
  meta.relics[i] = lv + 1;
  saveMeta();
  renderTown();
}

/* =====================================================================
 * 런 상태
 * ===================================================================== */
let run = null;   // 현재 런
let bt = null;    // 현재 전투
let busy = false; // 입력 잠금 (연출 중)
let uiMode = 'town'; // town|idle|anim|battle|levelup|jobchange|skilltree|shop|event|floorclear|result

function startRun() {
  const bn = runBonus();
  const sheet = newSheet(meta.selected);
  autoLearnSkills(sheet); // 시작 스킬 1개 (RunController 생성자와 동일)
  const player = buildUnit(sheet, bn);
  run = {
    charId: meta.selected, sheet, bonus: bn, mods: bn.mods,
    floor: 1, floorsCleared: 0,
    gold: bn.mods.startGold,
    potions: B.START_POTIONS + bn.mods.startPotions,
    kills: 0, gearCount: 0, diceRolls: 0,
    pos: 0, tiles: [], capturedThisFloor: 0,
    rerollLeft: CHARS[meta.selected].reroll,
    reviveLeft: CHARS[meta.selected].revive,
    alive: true,
    player,
    skills: equipActives(sheet)
  };
  logs = [];
  showScreen('run');
  genFloor();
  log('🏰 던전 1층 — ' + themeOf(1).name + '에 진입했다.');
  busy = false;
  uiMode = 'idle';
  updateHUD();
}
function refreshPlayer() {
  refreshUnit(run.sheet, run.player, run.bonus);
}
function reequip() {
  run.skills = equipActives(run.sheet);
}

/* ===== 층 생성 ===== */
function rollTileType() {
  const v = Math.random();
  let acc = B.TILE_BATTLE;
  if (v < acc) return 'battle';
  acc += B.TILE_ELITE;
  if (v < acc) return 'elite';
  acc += B.TILE_TREASURE;
  if (v < acc) return 'treasure';
  acc += B.TILE_EVENT;
  if (v < acc) return 'event';
  acc += B.TILE_TRAP;
  if (v < acc) return 'trap';
  return 'battle';
}
function genFloor() {
  const size = B.BOARD_SIZE;
  const types = new Array(size).fill(null);
  types[0] = 'start';
  const shopI = randInt(1, size);
  let restI;
  do { restI = randInt(1, size); } while (restI === shopI);
  types[shopI] = 'shop';
  types[restI] = 'rest';
  for (let i = 1; i < size; i++) {
    if (i === shopI || i === restI) continue;
    types[i] = rollTileType();
  }
  run.tiles = types.map((t, i) => ({ index: i, type: t, captured: false }));
  run.pos = 0;
  run.capturedThisFloor = 0;
  run.rerollLeft = CHARS[run.charId].reroll; // 층당 1회 (RunController.PlayFloor)
  renderBoard();
  placeToken(false);
  updateCenter();
}

/* ===== 보드 렌더링: 7×7 둘레 24칸 ===== */
function tileGridPos(i) {
  if (i <= 6)  return { r: 6,       c: i };
  if (i <= 12) return { r: 12 - i,  c: 6 };
  if (i <= 18) return { r: 0,       c: 18 - i };
  return       { r: i - 18,         c: 0 };
}
function renderBoard() {
  const board = $('board');
  board.innerHTML = '';
  run.tiles.forEach(t => {
    const p = tileGridPos(t.index);
    const d = document.createElement('div');
    d.className = 'tile ' + t.type + (t.captured ? ' captured' : '');
    d.id = 'tile-' + t.index;
    d.style.gridRow = (p.r + 1);
    d.style.gridColumn = (p.c + 1);
    d.textContent = TILE_DEFS[t.type].e;
    board.appendChild(d);
  });
  const center = document.createElement('div');
  center.className = 'board-center';
  center.innerHTML =
    '<div class="bc-theme" id="bcTheme"></div>' +
    '<div class="bc-floor" id="bcFloor"></div>' +
    '<div class="bc-elem" id="bcElem"></div>' +
    '<div class="dicewrap"><div class="die" id="die1">?</div><div class="die" id="die2">?</div></div>' +
    '<div class="bc-badges" id="bcBadges"></div>' +
    '<div class="bc-hint" id="bcHint"></div>';
  board.appendChild(center);
  const token = document.createElement('div');
  token.id = 'token';
  token.textContent = CHARS[run.charId].icon;
  board.appendChild(token);
}
function updateCenter() {
  const el = floorElement(run.floor);
  $('bcTheme').textContent = themeOf(run.floor).name;
  $('bcFloor').textContent = run.floor + 'F';
  $('bcElem').textContent = '몬스터 속성: ' + ELEM_INFO[el].icon + ' ' + ELEM_INFO[el].n;
  $('bcHint').textContent = '🚪 완주까지 ' + (B.BOARD_SIZE - run.pos) + '칸 → 보스전';
}
function placeToken(hop) {
  const el = $('tile-' + run.pos);
  const token = $('token');
  if (!el || !token) return;
  if (!hop) token.classList.add('notrans');
  token.style.left = (el.offsetLeft + el.offsetWidth / 2) + 'px';
  token.style.top  = (el.offsetTop  + el.offsetHeight * 0.42) + 'px';
  if (!hop) {
    void token.offsetWidth;
    token.classList.remove('notrans');
  } else {
    token.classList.remove('hopping');
    void token.offsetWidth;
    token.classList.add('hopping');
  }
  document.querySelectorAll('.tile.cur').forEach(t => t.classList.remove('cur'));
  el.classList.add('cur');
}

/* ===== HUD ===== */
function updateHUD() {
  if (!run) return;
  const p = run.player, sh = run.sheet;
  $('hudFloor').textContent = run.floor;
  $('hudJob').textContent = jobName(sh) + ' Lv.' + sh.level;
  $('hudGold').textContent = run.gold;
  $('hudSoul').textContent = meta.soul;
  const need = xpToLevel(sh.level);
  $('xpFill').style.width = Math.min(100, sh.xp / need * 100) + '%';
  $('xpText').textContent = 'XP ' + sh.xp + ' / ' + need;
  const ratio = Math.max(0, p.hp / p.maxHp);
  const fill = $('hpFill');
  fill.style.width = (ratio * 100) + '%';
  fill.style.background = ratio > 0.5
    ? 'linear-gradient(90deg,#4fd06a,#8ce07a)'
    : ratio > 0.25
      ? 'linear-gradient(90deg,#e0a03a,#f0c05a)'
      : 'linear-gradient(90deg,#d84848,#f07a5a)';
  $('hpText').textContent = '❤️ ' + p.hp + ' / ' + p.maxHp;
  $('subStats').textContent = '⚔️' + p.atk + ' 🔮' + p.matk + ' 🛡️' + p.def + '/' + p.mdef;
  $('btnFieldPotion').innerHTML = '🧪 ×' + run.potions + '<br><small style="font-size:9px;font-weight:600">HP 40%</small>';
  $('btnFieldPotion').disabled = busy || run.potions <= 0 || p.hp >= p.maxHp;
  $('btnRoll').disabled = busy;
  $('btnTree').disabled = busy;
  const badge = $('treeBadge');
  const pts = sh.points + sh.statPoints;
  badge.style.display = pts > 0 ? 'flex' : 'none';
  badge.textContent = pts;
}
function setBusy(v) {
  busy = v;
  updateHUD();
}

/* ===== 플레이어 회복/피해 (필드) ===== */
function healRatio(ratio, srcLabel) {
  const p = run.player;
  const amt = Math.round(p.maxHp * ratio);
  const real = Math.min(p.maxHp - p.hp, amt);
  p.hp = Math.min(p.maxHp, p.hp + amt);
  if (real > 0) floatText($('token') || $('hpFill'), '+' + real, 'heal');
  if (srcLabel) log('💚 ' + srcLabel + ' HP +' + real);
  updateHUD();
  return real;
}
function damagePlayerField(dmg, srcLabel) {
  const p = run.player;
  p.hp = Math.max(0, p.hp - dmg);
  shake($('boardWrap'));
  floatText($('token'), '-' + dmg, 'dmg');
  log('💥 ' + srcLabel + ' 피해 -' + dmg);
  updateHUD();
  if (p.hp <= 0) { die(); return false; }
  return true;
}
function addGold(g, label) {
  run.gold += g;
  floatText($('token'), '+' + g + ' 💰', 'gold');
  if (label) log('💰 ' + label + ' 골드 +' + g);
  updateHUD();
}
function addGear(silent) {
  const f = run.floor, sh = run.sheet;
  const a = B.gearAtk(f), d = B.gearDef(f), h = B.gearHp(f);
  run.gearCount++;
  sh.gearAtk += a; sh.gearDef += d; sh.gearHp += h;
  refreshPlayer(); // maxHp 증가분만큼 현재 HP도 증가
  if (!silent) floatText($('token'), '🗡️ 장비!', 'info');
  log('🗡️ 장비 획득! ⚔️+' + a + ' 🛡️+' + d + ' ❤️+' + h);
  updateHUD();
}
function useFieldPotion() {
  if (busy || !run || !run.alive) return;
  if (run.potions <= 0 || run.player.hp >= run.player.maxHp) return;
  run.potions--;
  healRatio(B.POTION_HEAL, '포션 사용!');
  updateHUD();
}

/* =====================================================================
 * 주사위 → 이동
 * ===================================================================== */
function rollDice() {
  if (busy || !run || !run.alive) return;
  setBusy(true);
  uiMode = 'anim';
  $('bcBadges').innerHTML = '';
  const d1El = $('die1'), d2El = $('die2');
  d1El.classList.add('rolling');
  d2El.classList.add('rolling');
  const tick = setInterval(() => {
    d1El.textContent = randInt(1, 7);
    d2El.textContent = randInt(1, 7);
  }, T.DICE_TICK);

  setTimeout(() => {
    clearInterval(tick);
    let d1 = randInt(1, 7), d2 = randInt(1, 7);
    run.diceRolls++;
    let rerolled = false;
    // 도적 패시브: 층당 1회, 낮은 눈(합≤4)이면 무료 리롤 (RunController.PlayFloor)
    if (run.rerollLeft && d1 + d2 <= 4) {
      run.rerollLeft = false;
      rerolled = true;
      d1 = randInt(1, 7); d2 = randInt(1, 7);
      run.diceRolls++;
    }
    const info = { d1, d2, sum: d1 + d2, isDouble: d1 === d2, isSeven: d1 + d2 === 7 };
    d1El.classList.remove('rolling'); d2El.classList.remove('rolling');
    d1El.textContent = d1; d2El.textContent = d2;
    d1El.classList.add('landed'); d2El.classList.add('landed');
    setTimeout(() => { d1El.classList.remove('landed'); d2El.classList.remove('landed'); }, 320);

    let badges = '';
    if (rerolled) badges += '<div class="badge">🥷 도적의 리롤!</div>';
    if (info.isDouble) badges += '<div class="badge">✨ 더블! 선제공격</div>';
    if (info.isSeven)  badges += '<div class="badge">🍀 럭키 7! 크리티컬 +15%</div>';
    $('bcBadges').innerHTML = badges;
    log('🎲 주사위: ' + d1 + ' + ' + d2 + ' = ' + info.sum +
        (rerolled ? ' (리롤)' : '') + (info.isDouble ? ' (더블!)' : '') + (info.isSeven ? ' (럭키 7!)' : ''));

    setTimeout(() => moveSteps(info), 380);
  }, T.DICE);
}

function moveSteps(info) {
  const lapComplete = run.pos + info.sum >= B.BOARD_SIZE;
  let remaining = info.sum;
  const step = () => {
    run.pos = (run.pos + 1) % B.BOARD_SIZE;
    placeToken(true);
    updateCenter();
    remaining--;
    if (remaining > 0) setTimeout(step, T.STEP);
    else setTimeout(() => land(lapComplete, info), T.LAND);
  };
  step();
}

function land(lapComplete, info) {
  if (lapComplete) {
    const g = Math.trunc(B.lapBonusGold(run.floor) * run.mods.lapGoldMult);
    addGold(g, '한 바퀴 완주!');
    log('👑 보스 게이트가 열렸다...');
    setTimeout(() => startBossBattle(info), 850);
    return;
  }
  resolveTile(info);
}

/* =====================================================================
 * 타일 이벤트 — RunController.ResolveTile 규칙
 * ===================================================================== */
function endTurn() {
  if (!run || !run.alive) return;
  uiMode = 'idle';
  setBusy(false);
}

function resolveTile(info) {
  const tile = run.tiles[run.pos];
  const f = run.floor;

  switch (tile.type) {
    case 'battle':
    case 'elite': {
      if (tile.captured) {
        healRatio(B.CAPTURED_HEAL + run.mods.captureHealBonus, '점령지(내 땅)에서 정비.');
        endTurn();
        return;
      }
      const elite = tile.type === 'elite';
      startBattle({
        monsters: makeMonsters(f, elite),
        info: info,
        title: elite ? '☠️ 정예 전투!' : '⚔️ 전투!',
        onWin: () => {
          tile.captured = true;
          run.capturedThisFloor++;
          const el = $('tile-' + tile.index);
          if (el) el.classList.add('captured');
          log('🚩 칸을 점령했다! (재방문 회복 · 전투 실드 +)');
          addGold(B.battleGold(f) * (elite ? 2 : 1), elite ? '정예 처치! (2배)' : '전투 승리!');
          if (elite) addGear();
          endTurn();
        }
      });
      return;
    }

    case 'treasure': {
      if (chance(B.MIMIC_CHANCE)) {
        log('📦 상자가... 움직인다?! 미믹이다!');
        startBattle({
          monsters: makeMonsters(f, false, true),
          info: info,
          title: '📦 미믹 기습!',
          onWin: () => { log('📦 미믹을 물리쳤다. (전리품은 없었다...)'); endTurn(); }
        });
        return;
      }
      if (chance(0.5)) addGear();
      else addGold(B.treasureGold(f), '보물 상자!');
      endTurn();
      return;
    }

    case 'shop':
      openShop();
      return;

    case 'rest': {
      const mult = CHARS[run.charId].restHeal2 ? 2 : 1; // 성직자: 쉼터 회복 2배
      healRatio(B.REST_HEAL * mult + run.mods.restHealBonus, '모닥불에서 휴식.');
      endTurn();
      return;
    }

    case 'trap': {
      if (chance(B.TRAP_AVOID + run.mods.trapAvoidBonus)) {
        log('🤸 함정을 재빠르게 회피했다!');
        floatText($('token'), '회피!', 'info');
        endTurn();
        return;
      }
      const dmg = Math.floor(run.player.maxHp * B.TRAP_DMG);
      if (damagePlayerField(dmg, '가시 함정!')) endTurn();
      return;
    }

    case 'event':
      openEvent();
      return;

    default:
      endTurn();
      return;
  }
}

/* ===== 이벤트 칸 (마법사: 나쁜 결과 1회 리롤) ===== */
let eventApply = null;
function openEvent() {
  const f = run.floor;
  let v = Math.random();
  let mageRerolled = false;
  if (CHARS[run.charId].bestEvent && v >= 0.40 && v < 0.75) {
    v = Math.random();
    mageRerolled = true;
  }
  let text;
  if (v < 0.40) {
    const g = B.treasureGold(f);
    text = '무너진 제단 아래에서 금화 주머니를 발견했다!<br><b style="color:#ffd76a">💰 골드 +' + g + '</b>';
    eventApply = () => { addGold(g, '이벤트:'); endTurn(); };
  } else if (v < 0.75) {
    const dmg = Math.floor(run.player.maxHp * 0.08);
    text = '어둠 속에서 무언가가 스치고 지나갔다...<br><b style="color:#ff6a5e">💢 피해 -' + dmg + '</b>';
    eventApply = () => { if (damagePlayerField(dmg, '불길한 기운!')) endTurn(); };
  } else {
    text = '떠돌이 대장장이가 낡은 장비를 건네주었다!<br><b style="color:#b8aef5">🗡️ 장비 획득</b>';
    eventApply = () => { addGear(); endTurn(); };
  }
  uiMode = 'event';
  overlay(
    '<div class="m-title">❓ 이벤트</div>' +
    '<div class="m-sub">' + themeOf(f).name + ' ' + f + '층' +
      (mageRerolled ? ' — 🧙 마법사의 통찰로 다시 선택!' : '') + '</div>' +
    '<p style="font-size:14.5px;line-height:1.8;margin:10px 0 4px">' + text + '</p>' +
    '<button class="m-btn" onclick="eventOk()">확인</button>'
  );
}
function eventOk() {
  closeOverlay();
  const fn = eventApply;
  eventApply = null;
  if (fn) fn();
}

/* ===== 상점 (상인의 인장: 할인) ===== */
function shopPrices() {
  const f = run.floor, disc = 1 - run.mods.shopDiscount;
  return { pot: Math.trunc(B.potionPrice(f) * disc), gear: Math.trunc(B.gearPrice(f) * disc) };
}
function openShop() {
  uiMode = 'shop';
  renderShop();
  log('⚖️ 상인을 만났다.');
}
function renderShop() {
  const f = run.floor, pr = shopPrices();
  overlay(
    '<div class="m-title">⚖️ 던전 상점</div>' +
    '<div class="m-sub">' + f + '층 시세' +
      (run.mods.shopDiscount > 0 ? ' (🪙 ' + Math.round(run.mods.shopDiscount * 100) + '% 할인)' : '') +
      ' — 보유 💰 <b id="shopGold">' + run.gold + '</b></div>' +
    '<div class="shop-item"><div class="info">🧪 포션<small>HP 40% 회복 (보유 ' +
      '<span id="shopPot">' + run.potions + '</span>개)</small></div>' +
      '<button class="buy-btn" id="buyPot" onclick="buyPotion()">💰 ' + pr.pot + '</button></div>' +
    '<div class="shop-item"><div class="info">🗡️ 장비<small>⚔️+' + B.gearAtk(f) + ' 🛡️+' + B.gearDef(f) +
      ' ❤️+' + B.gearHp(f) + ' (층 비례 성장)</small></div>' +
      '<button class="buy-btn" id="buyGear" onclick="buyGear()">💰 ' + pr.gear + '</button></div>' +
    '<button class="m-btn dark" onclick="closeShop()">나가기</button>'
  );
  refreshShopButtons();
}
function refreshShopButtons() {
  const pr = shopPrices();
  $('shopGold').textContent = run.gold;
  $('shopPot').textContent = run.potions;
  $('buyPot').disabled = run.gold < pr.pot;
  $('buyGear').disabled = run.gold < pr.gear;
}
function buyPotion() {
  const pr = shopPrices();
  if (run.gold < pr.pot) return;
  run.gold -= pr.pot;
  run.potions++;
  log('🧪 포션 구매 (-' + pr.pot + 'G)');
  updateHUD();
  refreshShopButtons();
}
function buyGear() {
  const pr = shopPrices();
  if (run.gold < pr.gear) return;
  run.gold -= pr.gear;
  addGear(true);
  updateHUD();
  refreshShopButtons();
}
function closeShop() {
  closeOverlay();
  endTurn();
}

/* =====================================================================
 * PART D — 전투 (InteractiveBattle.cs 이식: 플레이어 행동 + 몬스터 반격 = 1라운드)
 * ===================================================================== */
function makeMonsters(floor, elite, mimic) {
  const th = themeOf(floor);
  const hp = B.monsterHp(floor), atk = B.monsterAtk(floor), def = B.monsterDef(floor);
  const element = floorElement(floor);
  const mk = (name, emoji, mhp, matk, spd, isBoss) => ({
    name, emoji, isBoss: !!isBoss,
    maxHp: mhp, hp: mhp, atk: matk, matk: matk, def, mdef: def,
    spd, crit: 0.05, evasion: 0, accuracy: 0.9, element, st: {}
  });
  if (elite) {
    return [mk('정예 ' + th.mobName, '👹', Math.floor(hp * B.ELITE_HP_MULT), Math.floor(atk * B.ELITE_ATK_MULT), 9)];
  }
  if (mimic) {
    return [mk('미믹', '📦', hp, atk, 8)];
  }
  const count = floor <= B.SOLO_MONSTER_FLOORS ? 1 : randInt(1, 3);
  const list = [];
  for (let i = 0; i < count; i++) {
    list.push(mk(th.mobName + (count > 1 ? ' ' + (i + 1) : ''), th.mobs[randInt(0, th.mobs.length)], hp, atk, 8));
  }
  return list;
}
function makeBoss(floor) {
  const th = themeOf(floor);
  const hp = Math.floor(B.monsterHp(floor) * B.BOSS_HP_MULT);
  const atk = Math.floor(B.monsterAtk(floor) * B.BOSS_ATK_MULT);
  const def = B.monsterDef(floor);
  return [{
    name: th.bossName, emoji: th.boss, isBoss: true,
    maxHp: hp, hp, atk, matk: atk, def, mdef: def,
    spd: 9, crit: 0.05, evasion: 0, accuracy: 0.9, element: floorElement(floor), st: {}
  }];
}

function startBossBattle(info) {
  startBattle({
    monsters: makeBoss(run.floor),
    info: info,
    title: '👑 보스전 — ' + themeOf(run.floor).bossName,
    isBoss: true,
    onWin: () => floorClear()
  });
}

function startBattle(cfg) {
  const c = CHARS[run.charId], sh = run.sheet;
  // 점령 칸 실드: 기본 2/칸 × 기사 2배 × 요새화 3배 + 마법사 방벽 (RunController.Fight)
  const perTile = 2 * (c.captureShield2 ? 2 : 1) * (hasCaptureTriple(sh) ? 3 : 1);
  const startShield = run.capturedThisFloor * perTile + Math.trunc(run.player.maxHp * c.barrier);
  bt = {
    monsters: cfg.monsters,
    critBonus: cfg.info && cfg.info.isSeven ? 0.15 : 0,
    playerFirst: !!(cfg.info && cfg.info.isDouble),
    firstRound: true,
    defending: false,
    shield: startShield,
    burnOnHit: burnOnHitChance(sh),
    reviveRatio: hasReviveBoost(sh) ? 0.7 : 0.5, // 소생의 빛: 부활 HP 70%
    isBoss: !!cfg.isBoss,
    title: cfg.title,
    onWin: cfg.onWin,
    xpKills: 0,
    locked: true
  };
  let badges = '';
  if (bt.playerFirst) badges += '<div class="badge">✨ 더블 — 선제공격! (첫 턴 반격 없음)</div>';
  if (bt.critBonus > 0) badges += '<div class="badge">🍀 럭키 7 — 크리티컬 +15%</div>';
  if (startShield > 0) badges += '<div class="badge">🛡 시작 실드 ' + startShield + '</div>';

  const enemies = bt.monsters.map((m, i) =>
    '<div class="enemy" id="bt-en-' + i + '">' +
      '<div class="e-sprite' + (m.isBoss ? ' boss' : '') + '">' + m.emoji + '</div>' +
      '<div class="e-name">' + ELEM_INFO[m.element].icon + ' ' + m.name + '</div>' +
      '<div class="ehp"><div class="ehpfill" id="bt-ehp-' + i + '" style="width:100%"></div></div>' +
      '<div class="ehptext" id="bt-eht-' + i + '">' + m.hp + ' / ' + m.maxHp + '</div>' +
      '<div class="chips" id="bt-chips-' + i + '"></div>' +
    '</div>'
  ).join('');

  uiMode = 'battle';
  overlay(
    '<div class="m-title' + (bt.isBoss ? ' boss' : '') + '">' + bt.title + '</div>' +
    '<div class="m-badges">' + badges + '</div>' +
    '<div class="enemyRow">' + enemies + '</div>' +
    '<div id="btMsg"></div>' +
    '<div class="pl-row" id="btPlRow">' +
      '<div class="pl-sprite">' + CHARS[run.charId].icon + '</div>' +
      '<div class="pl-hp"><div class="hpbar"><div class="hpfill" id="btPhpFill"></div><span id="btPhpText"></span></div></div>' +
      '<div class="pl-shield" id="btShield"></div>' +
    '</div>' +
    '<div class="skillbar" id="btSkillBar"></div>' +
    '<div class="actions">' +
      '<button class="act-btn atk" id="btnAtk" onclick="btAttack()">⚔️ 공격</button>' +
      '<button class="act-btn def" id="btnDef" onclick="btDefend()">🛡️ 방어<small>피해 50%↓</small></button>' +
      '<button class="act-btn pot" id="btnPot" onclick="btPotion()">🧪 포션 ×' + run.potions + '<small>HP 40%</small></button>' +
    '</div>',
    'battle'
  );
  updateBattleUI();
  setTimeout(playerTurnStart, 400);
}

function renderSkillBar(enabled) {
  const bar = $('btSkillBar');
  if (!bar) return;
  const cells = [];
  for (let i = 0; i < B.SKILL_SLOTS; i++) {
    const s = run.skills[i];
    if (!s) {
      cells.push('<button class="sk-act empty" disabled>—<small>빈 슬롯</small></button>');
      continue;
    }
    const sub = [];
    if (s.coef > 0) sub.push((s.magic ? '🔮' : '⚔️') + Math.round(s.coef * 100) + '%');
    if (s.healRatio > 0) sub.push('✚' + Math.round(s.healRatio * 100) + '%');
    if (s.shieldRatio > 0) sub.push('🛡' + Math.round(s.shieldRatio * 100) + '%');
    if (s.element !== 'neutral') sub.push(ELEM_INFO[s.element].icon);
    if (s.aoe) sub.push('광역');
    if (s.applies) sub.push(STATUS_INFO[s.applies].icon);
    const onCd = s.cur > 0;
    cells.push('<button class="sk-act" id="btnSk' + i + '" onclick="btSkill(' + i + ')"' +
      ((enabled && !onCd) ? '' : ' disabled') + '>' +
      s.name + ' <span style="color:#ffd76a">Lv' + s.level + '</span>' +
      '<small>' + sub.join(' ') + ' · 쿨' + s.cooldown + '</small>' +
      (onCd ? '<span class="cd-mask">⏳' + s.cur + '</span>' : '') +
      '</button>');
  }
  bar.innerHTML = cells.join('');
}

function battleButtons(enabled) {
  ['btnAtk', 'btnDef', 'btnPot'].forEach(id => {
    const el = $(id);
    if (el) el.disabled = !enabled;
  });
  const pot = $('btnPot');
  if (pot) {
    pot.innerHTML = '🧪 포션 ×' + run.potions + '<small>HP 40%</small>';
    if (enabled && (run.potions <= 0 || run.player.hp >= run.player.maxHp)) pot.disabled = true;
  }
  renderSkillBar(enabled);
}
function btMsg(t) {
  const el = $('btMsg');
  if (el) el.textContent = t;
}
function renderChips(m, i) {
  const box = $('bt-chips-' + i);
  if (!box) return;
  box.innerHTML = Object.keys(m.st).map(k => {
    const s = STATUS_INFO[k], e = m.st[k];
    return '<span class="chip ' + s.cls + '">' + s.icon + s.n +
      (e.stacks > 1 ? '×' + e.stacks : '') + '</span>';
  }).join('');
}
function updateBattleUI() {
  if (!bt) return;
  bt.monsters.forEach((m, i) => {
    const fill = $('bt-ehp-' + i), txt = $('bt-eht-' + i), box = $('bt-en-' + i);
    if (!fill) return;
    fill.style.width = Math.max(0, m.hp / m.maxHp * 100) + '%';
    txt.textContent = m.hp + ' / ' + m.maxHp;
    if (m.hp <= 0) box.classList.add('dead');
    renderChips(m, i);
  });
  const p = run.player;
  const fill = $('btPhpFill'), txt = $('btPhpText'), shEl = $('btShield');
  if (fill) {
    const r = Math.max(0, p.hp / p.maxHp);
    fill.style.width = (r * 100) + '%';
    fill.style.background = r > 0.5 ? 'linear-gradient(90deg,#4fd06a,#8ce07a)'
      : r > 0.25 ? 'linear-gradient(90deg,#e0a03a,#f0c05a)' : 'linear-gradient(90deg,#d84848,#f07a5a)';
    txt.textContent = '❤️ ' + p.hp + ' / ' + p.maxHp;
  }
  if (shEl) shEl.textContent = bt.shield > 0 ? '🛡 ' + bt.shield : '';
  updateHUD();
}

function playerTurnStart() {
  if (!bt) return;
  bt.defending = false;
  bt.locked = false;
  btMsg('▶ 당신의 턴');
  battleButtons(true);
}
function aliveMonsters() { return bt.monsters.filter(m => m.hp > 0); }

/* 플레이어 타격 (기본 공격 or 공격 스킬) — InteractiveBattle.PlayerStrike */
function playerStrike(skill) {
  const aoe = !!(skill && skill.aoe);
  const alive = aliveMonsters().slice().sort((a, b) => a.hp - b.hp);
  const targets = aoe ? aliveMonsters() : alive.slice(0, 1);
  let msgParts = [];

  for (const t of targets) {
    const idx = bt.monsters.indexOf(t);
    const enEl = $('bt-en-' + idx);
    const r = computeDamage(run.player, t, skill, bt.critBonus);
    if (r.miss) {
      floatText(enEl, 'MISS', 'miss');
      msgParts.push(t.name + ' 회피!');
      continue;
    }
    t.hp = Math.max(0, t.hp - r.dmg);
    flashHit(enEl);
    shake($('modalBox'));
    floatText(enEl, (r.crit ? '크리! -' : '-') + r.dmg, r.crit ? 'crit' : 'dmg');
    if (r.mult > 1) floatText(enEl, '효과적! ×' + r.mult, 'eff');
    else if (r.mult < 1) floatText(enEl, '비효과적 ×' + r.mult, 'res');
    msgParts.push(t.name + ' -' + r.dmg + (r.crit ? ' 크리!' : ''));

    if (t.hp > 0) {
      if (skill && skill.applies) {
        applyStatus(t, skill.applies, Math.max(1, skill.stacks));
      } else if (bt.burnOnHit > 0 && chance(bt.burnOnHit)) {
        applyStatus(t, 'burn', 1); // 룬 나이트 발화
        floatText(enEl, '🔥 발화!', 'eff');
      }
    } else {
      run.kills++;
      bt.xpKills++;
      log('☠️ ' + t.name + ' 처치!');
    }
  }
  btMsg((skill ? '💫 ' + skill.name + '! ' : '⚔️ ') + msgParts.join(' / '));
  updateBattleUI();
}

function btAttack() {
  if (!bt || bt.locked) return;
  bt.locked = true;
  battleButtons(false);
  playerStrike(null);
  setTimeout(afterPlayerAction, 620);
}
function btSkill(i) {
  if (!bt || bt.locked) return;
  const s = run.skills[i];
  if (!s || s.cur > 0) return;
  bt.locked = true;
  battleButtons(false);
  s.cur = s.cooldown;
  if (s.healRatio > 0 || s.shieldRatio > 0) {
    // 회복/실드 스킬 (InteractiveBattle.DoRound Skill 분기)
    let msg = [];
    if (s.healRatio > 0) {
      const amt = Math.trunc(run.player.maxHp * s.healRatio);
      const real = Math.min(run.player.maxHp - run.player.hp, amt);
      run.player.hp = Math.min(run.player.maxHp, run.player.hp + amt);
      floatText($('btPlRow'), '+' + real, 'heal');
      msg.push('HP +' + real);
    }
    if (s.shieldRatio > 0) {
      const gain = Math.trunc(run.player.maxHp * s.shieldRatio);
      bt.shield += gain;
      floatText($('btPlRow'), '🛡 +' + gain, 'info');
      msg.push('실드 +' + gain);
    }
    btMsg('💫 ' + s.name + '! ' + msg.join(' · '));
    updateBattleUI();
  } else {
    playerStrike(s);
  }
  setTimeout(afterPlayerAction, 620);
}
function btDefend() {
  if (!bt || bt.locked) return;
  bt.locked = true;
  battleButtons(false);
  bt.defending = true;
  btMsg('🛡️ 방어 태세! 받는 피해 50% 감소');
  log('🛡️ 방어 태세를 취했다.');
  setTimeout(afterPlayerAction, 420);
}
function btPotion() {
  if (!bt || bt.locked) return;
  if (run.potions <= 0 || run.player.hp >= run.player.maxHp) return;
  bt.locked = true;
  battleButtons(false);
  run.potions--;
  const amt = Math.trunc(run.player.maxHp * B.POTION_HEAL);
  const real = Math.min(run.player.maxHp - run.player.hp, amt);
  run.player.hp = Math.min(run.player.maxHp, run.player.hp + amt);
  floatText($('btPlRow'), '+' + real, 'heal');
  btMsg('🧪 포션! HP +' + real);
  log('🧪 포션으로 HP ' + real + ' 회복');
  updateBattleUI();
  setTimeout(afterPlayerAction, 520);
}

/* 플레이어 행동 후: 승리 확인 → 몬스터 반격 → 쿨다운 감소 */
function afterPlayerAction() {
  if (!bt) return;
  if (aliveMonsters().length === 0) { winBattle(); return; }
  const monstersSkip = bt.firstRound && bt.playerFirst;
  bt.firstRound = false;
  if (monstersSkip) {
    btMsg('✨ 선제공격! 몬스터가 반격하지 못한다');
    endRound();
    return;
  }
  monsterPhase();
}

function monsterPhase() {
  const list = aliveMonsters();
  let i = 0;
  const next = () => {
    if (!bt) return;
    if (i >= list.length) { endRound(); return; }
    const m = list[i++];
    if (m.hp <= 0) { next(); return; }
    const idx = bt.monsters.indexOf(m);
    const enEl = $('bt-en-' + idx);

    // 턴 시작: 상태이상 도트/기절 (InteractiveBattle 몬스터 턴)
    const tick = tickStatuses(m);
    if (tick.damage > 0) {
      m.hp = Math.max(0, m.hp - tick.damage);
      floatText(enEl, '-' + tick.damage + ' ☠', 'dmg');
      updateBattleUI();
      if (m.hp <= 0) {
        run.kills++;
        bt.xpKills++;
        log('☠️ ' + m.name + ' — 상태이상으로 쓰러졌다!');
        btMsg('☠ ' + m.name + ' 도트 피해로 사망!');
        setTimeout(next, T.MOB_GAP * 0.6);
        return;
      }
    }
    if (tick.skip) {
      floatText(enEl, '💫 기절!', 'info');
      btMsg('💫 ' + m.name + '은(는) 기절해서 움직이지 못한다!');
      updateBattleUI();
      setTimeout(next, T.MOB_GAP * 0.7);
      return;
    }

    const r = computeDamage(m, run.player, null, 0);
    if (r.miss) {
      floatText($('btPlRow'), 'MISS', 'miss');
      btMsg('💨 ' + m.name + '의 공격을 회피했다!');
      setTimeout(next, T.MOB_GAP * 0.7);
      return;
    }
    let dmg = r.dmg;
    if (bt.defending) dmg = Math.max(1, Math.trunc(dmg / 2));
    const absorbed = Math.min(bt.shield, dmg);
    if (absorbed > 0) {
      bt.shield -= absorbed;
      floatText($('btPlRow'), '🛡 -' + absorbed, 'info');
    }
    const real = dmg - absorbed;
    run.player.hp = Math.max(0, run.player.hp - real);

    const plRow = $('btPlRow');
    flashHit(plRow);
    shake($('modalBox'));
    if (real > 0) floatText(plRow, '-' + real, r.crit ? 'crit' : 'dmg');
    btMsg('💢 ' + m.name + '의 공격! -' + real +
      (absorbed > 0 ? ' (실드 ' + absorbed + ' 흡수)' : '') +
      (bt.defending ? ' (방어)' : '') + (r.crit ? ' 크리!' : ''));
    updateBattleUI();

    if (run.player.hp <= 0) {
      if (run.reviveLeft) {
        run.reviveLeft = false;
        run.player.hp = Math.trunc(run.player.maxHp * bt.reviveRatio);
        floatText(plRow, '✨ 부활!', 'heal');
        btMsg('✨ 신앙의 힘으로 부활했다! HP ' + Math.round(bt.reviveRatio * 100) + '%');
        log('✨ 부활! (런당 1회)');
        updateBattleUI();
        setTimeout(next, T.MOB_GAP);
        return;
      }
      loseBattle();
      return;
    }
    setTimeout(next, T.MOB_GAP);
  };
  setTimeout(next, 460);
}

function endRound() {
  if (!bt) return;
  for (const s of run.skills) if (s.cur > 0) s.cur--;
  if (aliveMonsters().length === 0) { winBattle(); return; }
  setTimeout(playerTurnStart, 500);
}

function winBattle() {
  btMsg('🎉 승리!');
  const cb = bt.onWin;
  // 경험치: 처치 수 × (5+층×3) × 보스 5배 (RunController.GainBattleXp)
  const xp = bt.xpKills * B.monsterXp(run.floor) * (bt.isBoss ? B.BOSS_XP_MULT : 1);
  setTimeout(() => {
    bt = null;
    closeOverlay();
    if (xp > 0) {
      floatText($('token'), '+' + xp + ' XP', 'xp');
      const gained = gainXp(run.sheet, xp);
      log('✨ 경험치 +' + xp + (gained > 0 ? ' — 레벨 업!' : ''));
      updateHUD();
      if (gained > 0) { processProgression(cb); return; }
    }
    cb();
  }, T.WIN_CLOSE);
}
function loseBattle() {
  btMsg('💀 쓰러졌다...');
  log('💀 전투에서 패배했다...');
  setTimeout(() => {
    bt = null;
    closeOverlay();
    die();
  }, 1000);
}

/* =====================================================================
 * PART E — 성장 UI (레벨업 배분 → 전직 → 스킬트리) + 층 클리어/결산
 * ===================================================================== */
let progressionDone = null; // 성장 체인 완료 후 콜백

function processProgression(done) {
  progressionDone = done || progressionDone || (() => endTurn());
  const sh = run.sheet;
  if (sh.statPoints > 0) { openLevelUp(); return; }
  if (canJobChange(sh)) { openJobChange(); return; }
  if (sh.points > 0 && skillPool(sh).some(d => canLearn(sh, d))) { openSkillTree(true); return; }
  finishProgression();
}
function finishProgression() {
  reequip();
  refreshPlayer();
  updateHUD();
  const done = progressionDone;
  progressionDone = null;
  closeOverlay();
  if (done) done();
}

/* ----- 레벨업 팝업: 6스탯 배분 (+3/레벨) ----- */
function openLevelUp() {
  uiMode = 'levelup';
  const sh = run.sheet;
  overlay(
    '<div class="m-title lv">🆙 레벨 업! — Lv.' + sh.level + '</div>' +
    '<div class="m-sub">' + jobName(sh) + ' — 스탯 포인트를 배분하세요 (레벨당 +3)</div>' +
    '<div class="alloc-pts">남은 포인트 <span id="allocLeft">' + sh.statPoints + '</span></div>' +
    '<div class="alloc-grid">' +
    STAT_IDS.map(k =>
      '<div class="alloc-row">' +
        '<div class="an">' + STAT_INFO[k].icon + ' ' + STAT_INFO[k].n +
          '<small>' + STAT_INFO[k].d + '</small></div>' +
        '<div class="av" id="alloc-' + k + '">' + sh.stats[k] + '</div>' +
        '<button class="alloc-plus" id="allocBtn-' + k + '" onclick="lvAlloc(\'' + k + '\')">+</button>' +
      '</div>').join('') +
    '</div>' +
    '<button class="m-btn gold" id="btnLvOk" onclick="lvConfirm()" disabled>확인 (포인트를 모두 배분하세요)</button>'
  );
  refreshAllocUI();
}
function refreshAllocUI() {
  const sh = run.sheet;
  const left = $('allocLeft');
  if (!left) return;
  left.textContent = sh.statPoints;
  STAT_IDS.forEach(k => {
    const v = $('alloc-' + k), b = $('allocBtn-' + k);
    if (v) v.textContent = sh.stats[k];
    if (b) b.disabled = sh.statPoints <= 0;
  });
  const ok = $('btnLvOk');
  if (ok) {
    ok.disabled = sh.statPoints > 0;
    ok.textContent = sh.statPoints > 0 ? '확인 (포인트를 모두 배분하세요)' : '✔ 확인';
  }
}
function lvAlloc(k) {
  const sh = run.sheet;
  if (sh.statPoints <= 0) return;
  sh.stats[k]++;
  sh.statPoints--;
  refreshAllocUI();
}
function lvConfirm() {
  if (run.sheet.statPoints > 0) return;
  refreshPlayer();
  processProgression();
}

/* ----- 전직: 레벨 8, 2택1 카드 ----- */
function openJobChange() {
  uiMode = 'jobchange';
  const paths = pathsFor(run.sheet.job);
  const bonusText = p => STAT_IDS.filter(k => p.bonus[k] > 0)
    .map(k => STAT_INFO[k].n + ' +' + p.bonus[k]).join(' · ');
  overlay(
    '<div class="m-title lv">⚜️ 전직의 시간!</div>' +
    '<div class="m-sub">레벨 ' + B.JOB_CHANGE_LEVEL + ' 달성 — 두 번째 직업을 선택하세요 (보너스 스탯 +10)</div>' +
    '<div class="jobcards">' +
    paths.map(p =>
      '<div class="jobcard" onclick="pickJob(\'' + p.id + '\')">' +
        '<div class="ji">' + p.icon + '</div>' +
        '<div class="jn">' + p.name + '</div>' +
        '<div class="jb">' + bonusText(p) + '</div>' +
        '<div class="jd">' + p.desc + '<br>' +
          p.tree.map(s => s.name).join(' · ') + '</div>' +
      '</div>').join('') +
    '</div>'
  );
}
function pickJob(pathKey) {
  if (!jobChange(run.sheet, pathKey)) return;
  const p = PATHS[pathKey];
  log('⚜️ ' + p.name + '(으)로 전직했다! (+10 보너스 스탯)');
  refreshPlayer();
  updateHUD();
  processProgression();
}

/* ----- 스킬트리: 선행 조건 잠금 표시, 포인트 학습 (레벨 1~5) ----- */
function openSkillTree(inChain) {
  uiMode = 'skilltree';
  renderSkillTree(inChain);
}
function renderSkillTree(inChain) {
  const sh = run.sheet;
  const equipped = new Set(equipActives(sh).map(s => s.defId));
  const section = (title, defs) =>
    '<div class="tree-sec">' + title + '</div>' +
    defs.map(def => {
      const lv = levelOf(sh, def.id);
      const lockText = def.prereqId && levelOf(sh, def.prereqId) < def.prereqLv
        ? '🔒 선행: ' + (skillPool(sh).find(d => d.id === def.prereqId) || { name: def.prereqId }).name + ' Lv.' + def.prereqLv + ' 필요'
        : '';
      const learnable = canLearn(sh, def);
      return '<div class="sk-row' + (lockText ? ' locked' : '') + '">' +
        '<div class="sk-icon">' + skillIcon(def) + '</div>' +
        '<div class="sk-body">' +
          '<div class="sk-name">' + def.name + ' <span class="sk-lv">Lv.' + lv + '/' + def.maxLv + '</span>' +
            (equipped.has(def.id) ? ' <span class="sk-eq">⭐장착</span>' : '') + '</div>' +
          '<div class="sk-desc">' + skillDesc(def, lv || 1) + '</div>' +
          (lockText ? '<div class="sk-lock">' + lockText + '</div>' : '') +
        '</div>' +
        (lv >= def.maxLv
          ? '<button class="sk-btn" disabled>MAX</button>'
          : '<button class="sk-btn" onclick="learnSk(\'' + def.id + '\')"' + (learnable ? '' : ' disabled') + '>배우기</button>') +
      '</div>';
    }).join('');

  let html =
    '<div class="m-title">📖 스킬 트리 — ' + jobName(sh) + '</div>' +
    '<div class="tree-pts">스킬 포인트 <b>' + sh.points + '</b> (액티브는 계수 상위 ' + B.SKILL_SLOTS + '개 자동 장착)</div>' +
    section('1차 — ' + CHARS[sh.job].name, BASE_TREES[sh.job]);
  if (sh.advanced) html += section('2차 — ' + PATHS[sh.advanced].name, PATHS[sh.advanced].tree);
  html += '<button class="m-btn gold" onclick="closeTree()">' + (inChain ? '✔ 완료' : '닫기') + '</button>';
  overlay(html);
}
function learnSk(id) {
  const sh = run.sheet;
  const def = skillPool(sh).find(d => d.id === id);
  if (!def || !learnSkill(sh, def)) return;
  log('📖 ' + def.name + ' Lv.' + levelOf(sh, id) + ' 습득!');
  renderSkillTree(progressionDone != null);
}
function closeTree() {
  if (progressionDone) { finishProgression(); return; }
  reequip();
  refreshPlayer();
  updateHUD();
  closeOverlay();
  endTurn();
}
function openTreeFromBar() {
  if (busy || !run || !run.alive || uiMode !== 'idle') return;
  setBusy(true);
  uiMode = 'skilltree';
  openSkillTree(false);
}

/* =====================================================================
 * 층 클리어 / 하강·귀환 / 결산
 * ===================================================================== */
function floorClear() {
  run.floorsCleared = run.floor;
  const healed = healRatio(B.FLOOR_CLEAR_HEAL);
  log('🏆 ' + run.floor + '층 클리어! HP +' + healed + ' (35% 회복)');

  if (run.floor >= B.FINAL_FLOOR) {
    endRun(false, true);
    return;
  }
  const nf = run.floor + 1;
  const p = run.player;
  uiMode = 'floorclear';
  overlay(
    '<div class="m-title">🏆 ' + run.floor + '층 클리어!</div>' +
    '<div class="m-sub">층 클리어 보상: HP 35% 회복 → ❤️ ' + p.hp + ' / ' + p.maxHp + '</div>' +
    '<div class="m-rows">' +
      '<div class="row"><span>다음 층</span><span>' + nf + '층 — ' + themeOf(nf).name + '</span></div>' +
      '<div class="row"><span>몬스터 속성</span><span>' + ELEM_INFO[floorElement(nf)].icon + ' ' +
        ELEM_INFO[floorElement(nf)].n + '</span></div>' +
      '<div class="row"><span>몬스터 HP / 공격</span><span>' + B.monsterHp(nf) + ' / ' + B.monsterAtk(nf) + '</span></div>' +
      '<div class="row"><span>현재 예상 소울스톤</span><span>💠 ' + calcStones(false) + '</span></div>' +
    '</div>' +
    '<button class="m-btn danger" onclick="descend()">⬇️ 하강 — 더 큰 보상, 사망 시 70%만 회수</button>' +
    '<button class="m-btn gold" onclick="retreat()">🏠 귀환 — 소울스톤 100% 회수</button>'
  );
}
function descend() {
  closeOverlay();
  run.floor++;
  genFloor();
  updateHUD();
  log('⬇️ ' + run.floor + '층 — ' + themeOf(run.floor).name + '으로 하강했다.');
  endTurn();
}
function retreat() {
  closeOverlay();
  endRun(false, false);
}
function die() {
  run.alive = false;
  setBusy(true);
  endRun(true, false);
}
/* 소울스톤: (층×10 + 킬) × 영혼 수확기, 사망 시 70% (RunController.Play) */
function calcStones(died) {
  let stones = B.soulstonesForRun(run.floorsCleared, run.kills) * run.mods.soulMult;
  if (died) stones *= B.DEATH_PENALTY;
  return Math.trunc(stones);
}
function endRun(died, victory) {
  setBusy(true);
  uiMode = 'result';
  const stones = calcStones(died);
  run.pendingStones = stones;
  run.died = died;

  const title = victory ? '🏆 심연 정복!' : died ? '💀 사망...' : '🏠 귀환 완료';
  const sub = victory ? '15층 최종 보스를 쓰러뜨렸다! 런 승리!'
    : died ? run.floor + '층에서 쓰러졌다. 소울스톤 70%만 회수한다.'
    : '무사히 마을로 돌아왔다. 소울스톤 100% 회수!';

  overlay(
    '<div class="m-title' + (died ? ' boss' : '') + '">' + title + '</div>' +
    '<div class="m-sub">' + sub + '</div>' +
    '<div class="m-rows">' +
      '<div class="row"><span>직업</span><span>' + jobName(run.sheet) + ' Lv.' + run.sheet.level + '</span></div>' +
      '<div class="row"><span>클리어한 층</span><span>' + run.floorsCleared + '층</span></div>' +
      '<div class="row"><span>처치한 몬스터</span><span>' + run.kills + '마리</span></div>' +
      '<div class="row"><span>획득 장비</span><span>' + run.gearCount + '개</span></div>' +
      '<div class="row"><span>주사위 굴림</span><span>' + run.diceRolls + '회</span></div>' +
      '<div class="row"><span>골드 (런 종료 시 소멸)</span><span>💰 ' + run.gold + '</span></div>' +
      '<div class="row"><span><b>소울스톤 획득</b></span><span><b style="color:#8fd0ff">💠 +' + stones +
        (died ? ' (70%)' : '') + '</b></span></div>' +
    '</div>' +
    '<button class="m-btn gold" onclick="backToTown()">🏰 마을로 돌아가기</button>'
  );
}
function backToTown() {
  meta.soul += run.pendingStones || 0;
  meta.totalRuns++;
  if (run.floorsCleared > meta.bestFloor) meta.bestFloor = run.floorsCleared;
  saveMeta();
  run = null;
  bt = null;
  busy = false;
  uiMode = 'town';
  closeOverlay();
  renderTown();
  showScreen('town');
}

/* =====================================================================
 * 디버그/자동 검증 훅 + 초기화
 * ===================================================================== */
window.DD = {
  get run() { return run; },
  get bt() { return bt; },
  get meta() { return meta; },
  set meta(m) { meta = m; },
  get uiMode() { return uiMode; },
  get busy() { return busy; },
  xpToLevel, skillPool, canLearn, levelOf, equipActives, pathsFor,
  CHARS, PATHS, BASE_TREES, B, RELICS
};

window.addEventListener('resize', () => { if (run) placeToken(false); });
loadMeta();
renderTown();
showScreen('town');
</script>
</body>
</html>
